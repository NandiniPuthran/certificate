# roles/crl_app_config/defaults/main.yml

---

# ===== CRL FILE LOCATION (from crl_consumer) =====
crl_file: "/etc/crl/ca.crl"

# ===== APPLICATIONS TO CONFIGURE =====
# Set to true to configure, false to skip
configure_apache: true
configure_haproxy: true
configure_rsyslog: true
configure_etcd: true
configure_freeradius: true

# ===== APACHE CRL CONFIGURATION =====
apache_enable_crl_check: true
apache_crl_verify_depth: 10
apache_require_client_cert: "optional"  # optional or require
apache_crl_check_all: false
apache_config_dir: "/etc/apache2"

# ===== HAPROXY CRL CONFIGURATION =====
haproxy_enable_crl: true
haproxy_config_file: "/etc/haproxy/haproxy.cfg"
haproxy_service_name: "haproxy"
haproxy_backend_crl_check: true

# ===== RSYSLOG CRL CONFIGURATION =====
rsyslog_enable_crl: true
rsyslog_driver: "ossl"  # ossl (GnuTLS) or gtls
rsyslog_config_dir: "/etc/rsyslog.d"
rsyslog_config_file: "/etc/rsyslog.d/10-crl.conf"
rsyslog_service_name: "rsyslog"
rsyslog_tls_lib: "openssl"  # Use openssl driver for CRL support

# ===== ETCD CRL CONFIGURATION =====
etcd_enable_crl: true
etcd_config_dir: "/etc/etcd"
etcd_config_file: "/etc/etcd/etcd.conf.yml"
etcd_service_name: "etcd"
etcd_client_auto_tls: false
etcd_peer_auto_tls: false
etcd_verify_client: "on"  # on or off

# ===== FREERADIUS CRL CONFIGURATION =====
freeradius_enable_crl: true
freeradius_config_dir: "/etc/freeradius/3.0"
freeradius_eap_config: "/etc/freeradius/3.0/mods-enabled/eap"
freeradius_service_name: "freeradius"
freeradius_check_crl: true
freeradius_crl_check_all: false

# ===== BACKUP CONFIGURATION =====
backup_configs: true
backup_dir: "/var/backups/crl-app-config"

# ===== VALIDATION =====
validate_configuration: true