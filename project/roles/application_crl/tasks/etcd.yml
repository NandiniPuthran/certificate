---
# Configure etcd to validate client certificates with CRL
# Uses lineinfile to modify EXISTING etcd config

- name: "Configure etcd CRL Validation"
  block:

    - name: "Check if etcd is installed"
      ansible.builtin.command:
        cmd: "which etcd"
      become: true
      register: etcd_check
      failed_when: false
      changed_when: false
      tags:
        - etcd

    - name: "Display etcd Status"
      ansible.builtin.debug:
        msg: |
          etcd Status:
          - Installed: {{ 'Yes ✅' if etcd_check.rc == 0 else 'No (skipping)' }}
      tags:
        - etcd

    - name: "Backup existing etcd config"
      ansible.builtin.copy:
        src: "{{ etcd_config_file }}"
        dest: "{{ backup_dir }}/etcd.conf.yml.backup"
        remote_src: true
      become: true
      when: etcd_check.rc == 0
      tags:
        - etcd

    - name: "Add client-crl-file to etcd config"
      ansible.builtin.lineinfile:
        path: "{{ etcd_config_file }}"
        line: "client-crl-file: {{ crl_file }}"
        insertafter: "^#?client-cert-auth:"
        state: present
      become: true
      when: etcd_check.rc == 0
      tags:
        - etcd

    - name: "Add peer-crl-file to etcd config"
      ansible.builtin.lineinfile:
        path: "{{ etcd_config_file }}"
        line: "peer-crl-file: {{ crl_file }}"
        insertafter: "^#?peer-client-cert-auth:"
        state: present
      become: true
      when: etcd_check.rc == 0
      notify: "restart etcd"
      tags:
        - etcd

    - name: "Verify etcd configuration"
      ansible.builtin.command:
        cmd: "grep -E 'client-crl-file|peer-crl-file' {{ etcd_config_file }}"
      become: true
      when: etcd_check.rc == 0
      register: etcd_verify
      failed_when: etcd_verify.rc != 0
      tags:
        - etcd

    - name: "Display etcd Configuration Status"
      ansible.builtin.debug:
        msg: |
          etcd CRL Configuration:
          - Config File: {{ etcd_config_file }} (MODIFIED)
          - CRL File: {{ crl_file }} ✅
          - Directives Added:
            ├─ client-crl-file: {{ crl_file }}
            └─ peer-crl-file: {{ crl_file }}
          - Backup: {{ backup_dir }}/etcd.conf.yml.backup ✅
          - Verification: OK ✅
      tags:
        - etcd

  tags:
    - crl_app_config
    - etcd