---
# Configure HAProxy to validate client certificates with CRL
# Uses lineinfile to modify EXISTING HAProxy config

- name: "Configure HAProxy CRL Validation"
  block:

    - name: "Check if HAProxy is installed"
      ansible.builtin.command:
        cmd: "which haproxy"
      become: true
      register: haproxy_check
      failed_when: false
      changed_when: false
      tags:
        - haproxy

    - name: "Display HAProxy Status"
      ansible.builtin.debug:
        msg: |
          HAProxy Status:
          - Installed: {{ 'Yes ✅' if haproxy_check.rc == 0 else 'No (skipping)' }}
      tags:
        - haproxy

    - name: "Backup existing HAProxy config"
      ansible.builtin.copy:
        src: "{{ haproxy_config_file }}"
        dest: "{{ backup_dir }}/haproxy.cfg.backup"
        remote_src: true
      become: true
      when: haproxy_check.rc == 0
      tags:
        - haproxy

    - name: "Find frontend/backend with SSL bind"
      ansible.builtin.shell:
        cmd: "grep -n 'bind.*:443' {{ haproxy_config_file }} | head -1 | cut -d: -f1"
      become: true
      when: haproxy_check.rc == 0
      register: haproxy_bind_line
      failed_when: false
      tags:
        - haproxy

    - name: "Add CRL file to bind directive (if using crt)"
      ansible.builtin.lineinfile:
        path: "{{ haproxy_config_file }}"
        line: "    crl-file {{ crl_file }}"
        insertafter: "^\s*bind.*:443.*crt"
        state: present
      become: true
      when: haproxy_check.rc == 0 and haproxy_bind_line.stdout != ""
      tags:
        - haproxy

    - name: "Add ca-file if not present"
      ansible.builtin.lineinfile:
        path: "{{ haproxy_config_file }}"
        line: "    ca-file /etc/ssl/certs/ca-certificates.crt crl-file {{ crl_file }}"
        insertafter: "^\s*bind.*:443"
        state: present
      become: true
      when: haproxy_check.rc == 0
      tags:
        - haproxy

    - name: "Test HAProxy configuration"
      ansible.builtin.command:
        cmd: "haproxy -c -f {{ haproxy_config_file }}"
      become: true
      when: haproxy_check.rc == 0
      register: haproxy_test
      failed_when: haproxy_test.rc != 0
      notify: "restart haproxy"
      tags:
        - haproxy

    - name: "Display HAProxy Configuration Status"
      ansible.builtin.debug:
        msg: |
          HAProxy CRL Configuration:
          - Config File: {{ haproxy_config_file }} (MODIFIED)
          - CRL File: {{ crl_file }} ✅
          - Directive Added: crl-file {{ crl_file }}
          - Backup: {{ backup_dir }}/haproxy.cfg.backup ✅
          - Syntax Check: OK ✅
      tags:
        - haproxy

  tags:
    - crl_app_config
    - haproxy