---

# Main orchestrator - configures applications to use CRL

- name: "Configure Applications to Use CRL"
  block:

    # ===== PHASE 1: VALIDATE CRL EXISTS =====
    - name: "Verify CRL file exists"
      ansible.builtin.stat:
        path: "{{ crl_file }}"
      become: true
      register: crl_stat
      failed_when: not crl_stat.stat.exists
      tags:
        - crl_app_config

    - name: "Display CRL Status"
      ansible.builtin.debug:
        msg: |
          CRL File Status:
          - Path: {{ crl_file }}
          - Exists: {{ 'Yes ✅' if crl_stat.stat.exists else 'No ❌' }}
          - Size: {{ crl_stat.stat.size }} bytes
          - Readable: {{ 'Yes ✅' if crl_stat.stat.readable else 'No ❌' }}
      tags:
        - crl_app_config

    # ===== PHASE 2: CREATE BACKUP DIRECTORY =====
    - name: "Create backup directory"
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true
      when: backup_configs
      tags:
        - crl_app_config

    # ===== PHASE 3: CONFIGURE APPLICATIONS =====
    - name: "Configure Apache to Use CRL"
      ansible.builtin.include_tasks: apache.yml
      when: configure_apache
      tags:
        - crl_app_config
        - apache

    - name: "Configure HAProxy to Use CRL"
      ansible.builtin.include_tasks: haproxy.yml
      when: configure_haproxy
      tags:
        - crl_app_config
        - haproxy

    - name: "Configure rsyslog to Use CRL"
      ansible.builtin.include_tasks: rsyslog.yml
      when: configure_rsyslog
      tags:
        - crl_app_config
        - rsyslog

    - name: "Configure etcd to Use CRL"
      ansible.builtin.include_tasks: etcd.yml
      when: configure_etcd
      tags:
        - crl_app_config
        - etcd

    - name: "Configure FreeRADIUS to Use CRL"
      ansible.builtin.include_tasks: freeradius.yml
      when: configure_freeradius
      tags:
        - crl_app_config
        - freeradius

    # ===== PHASE 4: VALIDATE CONFIGURATION =====
    - name: "Validate Application Configurations"
      ansible.builtin.include_tasks: validate.yml
      when: validate_configuration
      tags:
        - crl_app_config
        - validate

  tags:
    - crl_app_config

# ===== Display Summary =====
- name: "Display Configuration Summary"
  ansible.builtin.debug:
    msg: |
      ✅ Application CRL Configuration Complete!
      
      Configured Applications:
      - Apache: {{ 'Yes ✅' if configure_apache else 'No' }}
      - HAProxy: {{ 'Yes ✅' if configure_haproxy else 'No' }}
      - rsyslog: {{ 'Yes ✅' if configure_rsyslog else 'No' }}
      - etcd: {{ 'Yes ✅' if configure_etcd else 'No' }}
      - FreeRADIUS: {{ 'Yes ✅' if configure_freeradius else 'No' }}
      
      CRL Location: {{ crl_file }}
      Backup Location: {{ backup_dir }}
      
      Next Steps:
      1. Verify applications are using CRL
      2. Test certificate validation
      3. Monitor application logs
      
      Verification Commands:
      - Apache: sudo apache2ctl -S
      - HAProxy: sudo haproxy -c -f /etc/haproxy/haproxy.cfg
      - rsyslog: sudo rsyslogd -N 1
      - etcd: sudo etcdctl member list (with client certs)
      - FreeRADIUS: sudo radiusd -X (debug mode)
  tags:
    - crl_app_config