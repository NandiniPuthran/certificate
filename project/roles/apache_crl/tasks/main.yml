---

- name: "Setup Apache CRL Publisher (Non-Destructive)"
  block:

    # ===== PHASE 1: INSTALL =====
    - name: "PHASE 1: Install Apache and Dependencies"
      ansible.builtin.include_tasks: install.yml
      tags:
        - apache_crl
        - install

    # ===== PHASE 2: CONFIGURE =====
    - name: "PHASE 2: Configure Apache for CRL"
      ansible.builtin.include_tasks: configure.yml
      tags:
        - apache_crl
        - configure

    # ===== PHASE 3: VALIDATE =====
    - name: "PHASE 3: Validate Configuration"
      ansible.builtin.include_tasks: validate.yml
      tags:
        - apache_crl
        - validate

  tags:
    - apache_crl

# ===== Display Final Summary =====
- name: "Display Final Setup Summary"
  ansible.builtin.debug:
    msg: |
      ✅ Apache CRL Publisher Setup Complete!
      
      Configuration Summary:
      ├─ Listen Port: {{ apache_listen_ssl_port }} (HTTPS only)
      ├─ Server Name: {{ apache_vhost_name }}
      ├─ Document Root: {{ apache_document_root }}
      ├─ CRL File: {{ apache_crl_filepath }}
      └─ Existing Sites: Preserved ✅
      
      Services:
      ├─ Apache: {{ apache_service_name }} (running, enabled)
      ├─ Modules: ssl, headers (enabled)
      └─ Ports: 80, 443 (existing), 9443 (new)
      
      Access CRL:
      - https://{{ apache_vhost_name }}:{{ apache_listen_ssl_port }}/crl/ca.crl
      
      Verify:
      - sudo systemctl status apache2
      - curl -k https://localhost:9443/crl/ca.crl
      - sudo ss -tlnp | grep apache2
  tags:
    - apache_crl