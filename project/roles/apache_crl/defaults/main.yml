---

# ===== SOURCE (from crl_publisher) =====
crl_source_path: "/tmp/crl-publisher-export/ca.crl"

# ===== APACHE CONFIGURATION =====
apache_package_name: "apache2"
apache_service_name: "apache2"
apache_config_dir: "/etc/apache2"
apache_enabled_dir: "/etc/apache2/conf-enabled"
apache_user: "www-data"
apache_group: "www-data"

# ===== HTTPS-ONLY CONFIGURATION =====
apache_listen_ssl_port: 9443
apache_vhost_name: "it-server-01.yourdomain.com"
apache_admin_email: "admin@yourdomain.com"
apache_document_root: "/var/www/crl"
apache_crl_directory: "/var/www/crl/crl"
apache_crl_filepath: "/var/www/crl/crl/ca.crl"

# ===== SSL CERTIFICATES =====
apache_ssl_cert_file: "/etc/pki/tls/certs/server.crt"
apache_ssl_key_file: "/etc/pki/tls/private/server.key"

# ===== LOGGING =====
apache_error_log: "/var/log/apache2/crl-error.log"
apache_access_log: "/var/log/apache2/crl-access.log"

# ===== BEHAVIOR =====
apache_already_installed: false