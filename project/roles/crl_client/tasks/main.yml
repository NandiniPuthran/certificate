---

# Main orchestrator - calls specialized task files in sequence

- name: "Setup CRL Consumer (Download CRL from Publisher)"
  block:

    # ===== PHASE 1: INSTALL =====
    - name: "PHASE 1: Install Dependencies"
      ansible.builtin.include_tasks: install.yml
      tags:
        - crl_consumer
        - install

    # ===== PHASE 2: CONFIGURE =====
    - name: "PHASE 2: Configure CRL Consumer"
      ansible.builtin.include_tasks: configure.yml
      tags:
        - crl_consumer
        - configure

    # ===== PHASE 3: VALIDATE =====
    - name: "PHASE 3: Validate Configuration"
      ansible.builtin.include_tasks: validate.yml
      tags:
        - crl_consumer
        - validate

  tags:
    - crl_consumer

# ===== Display Final Summary =====
- name: "Display Final Setup Summary"
  ansible.builtin.debug:
    msg: |
      ✅ CRL Consumer Setup Complete!
      
      Configuration Summary:
      ├─ CRL Server: {{ crl_server_url }}
      ├─ Local Storage: {{ crl_consumer_crl_file }}
      ├─ Download Schedule: Every 30 minutes
      ├─ Health Check: Every 1 hour
      └─ SSL Verification: {{ 'Disabled (self-signed)' if crl_consumer_skip_ssl_verification else 'Enabled' }}
      
      Services:
      ├─ Timer: {{ crl_consumer_timer_name }}.timer (every 30 mins)
      ├─ Service: {{ crl_consumer_service_name }}.service
      └─ Health Check: Cron job (every 1 hour)
      
      Verify:
      - sudo systemctl status {{ crl_consumer_timer_name }}.timer
      - sudo systemctl list-timers {{ crl_consumer_timer_name }}.timer
      - sudo /usr/local/bin/crl-consumer-download.sh
      - /usr/local/bin/crl-consumer-health-check.sh
      
      Monitor:
      - sudo journalctl -u {{ crl_consumer_service_name }}.service -f
      - sudo tail -f {{ crl_consumer_log_file }}
  tags:
    - crl_consumer