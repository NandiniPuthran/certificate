# roles/crl_consumer/defaults/main.yml

---

# ===== CRL SERVER (from apache_crl) =====
crl_server_url: "https://it-server-01.yourdomain.com:9443/crl/ca.crl"

# ===== LOCAL STORAGE =====
crl_consumer_download_dir: "/etc/crl"
crl_consumer_crl_file: "/etc/crl/ca.crl"

# ===== DOWNLOAD SCHEDULE =====
# Every 30 minutes (same as crl_publisher for synchronized safety)
crl_consumer_download_schedule: "*/30 * * * *"

# ===== SYSTEMD CONFIGURATION =====
crl_consumer_service_name: "crl-consumer-download"
crl_consumer_timer_name: "crl-consumer-download"

# ===== SSL CERTIFICATE VALIDATION =====
# For self-signed certs: true (skip validation)
# For proper certs: false (validate)
crl_consumer_skip_ssl_verification: true

# ===== TIMEOUTS =====
crl_consumer_download_timeout: 30  # seconds
crl_consumer_max_retries: 3

# ===== LOGGING =====
crl_consumer_log_dir: "/var/log/crl-consumer"
crl_consumer_log_file: "/var/log/crl-consumer/download.log"

# ===== HEALTH CHECK THRESHOLDS =====
crl_consumer_max_age_minutes: 60      # Alert if not downloaded in 60 mins
crl_consumer_min_hours_remaining: 2.5 # Alert if CRL expires in < 2.5 hours