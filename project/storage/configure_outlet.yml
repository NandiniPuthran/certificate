---
# Runs against the "pdus" inventory group. Each PDU's host_vars define:
#   pdu_outlet_count: 42
#   outlet: [{id, name, delay}, ...]   <- your existing var, unchanged
# Any outlet id in 1..pdu_outlet_count NOT present in `outlet` is treated
# as unused: name left alone, delay/state forced to the unused defaults.

# ==========================================================================
# 1. SAFETY GATE
# ==========================================================================
- name: Abort unless explicitly confirmed
  ansible.builtin.assert:
    that:
      - pdu_apply_confirm | bool
    fail_msg: >-
      Refusing to modify PDU outlet startup settings without
      pdu_apply_confirm=true. Re-run with -e pdu_apply_confirm=true
      once you've reviewed the plan.

- name: Ensure this PDU defines its outlet count
  ansible.builtin.assert:
    that:
      - pdu_outlet_count is defined
      - pdu_outlet_count | int > 0
    fail_msg: >-
      {{ inventory_hostname }} has no pdu_outlet_count defined in its
      host_vars — the role doesn't know how many outlets to reconcile.

# ==========================================================================
# 2. BUILD FULL OUTLET LIST (1..pdu_outlet_count), COMPUTING state
# ==========================================================================
# Split into three small steps instead of one task doing everything, so
# each step is easy to read/debug on its own.

# Step 2a: turn `outlet` (list) into a dict keyed by id, so later lookups
# are a simple key check instead of a search through the list each time.
- name: Build a lookup of configured outlets by id
  ansible.builtin.set_fact:
    pdu_outlet_by_id: "{{ dict(outlet | default([]) | map(attribute='id') | zip(outlet | default([]))) }}"

# Step 2b: fail fast if two rows in `outlet` claim the same id — a dict
# collapses duplicates silently, so compare lengths to catch that instead.
- name: Fail on duplicate outlet ids in the outlet list
  ansible.builtin.assert:
    that:
      - pdu_outlet_by_id | length == (outlet | default([]) | length)
    fail_msg: >-
      Two or more entries in {{ inventory_hostname }}'s `outlet` list share
      the same id. Check host_vars for duplicates.

# Step 2c: walk 1..pdu_outlet_count, and for each id either use its
# configured entry (from the lookup) or fall back to the unused defaults.
# `configured` is empty ({}) for any id not in the lookup, so `.get()`
# falling through to defaults handles both cases without a separate
# active/unused branch.
- name: Build normalized outlet list for every outlet on this PDU
  ansible.builtin.set_fact:
    pdu_outlets_full: "{{ pdu_outlets_full | default([]) + [entry] }}"
  vars:
    configured: "{{ pdu_outlet_by_id.get(outlet_num, {}) }}"
    entry:
      id: "{{ outlet_num }}"
      name: "{{ configured.get('name', '') }}"
      delay: "{{ configured.get('delay', pdu_active_default_delay if configured else pdu_unused_delay) }}"
      state: "{{ pdu_active_startup_state if configured else pdu_unused_startup_state }}"
  loop: "{{ range(1, (pdu_outlet_count | int) + 1) | list }}"
  loop_control:
    loop_var: outlet_num

- name: Show planned changes (dry-run visibility)
  ansible.builtin.debug:
    var: pdu_outlets_full

# ==========================================================================
# 3. APPLY — same rset pattern as the existing role, extended with state
# ==========================================================================
- name: Configure name of each outlet
  ansible.builtin.shell: >-
    {{ eaton_payload }} rset set
    /powerDistribution/1/outlets/{{ item.id }}/identification/friendlyName
    {{ item.name | quote }}
  loop: "{{ pdu_outlets_full }}"
  when: item.name | length > 0   # don't rename unused outlets away from their existing label
  register: outlet_name_result
  changed_when: outlet_name_result.rc == 0
  failed_when: outlet_name_result.rc != 0
  delegate_to: localhost

- name: Set startup delay for each outlet
  ansible.builtin.shell: >-
    {{ eaton_payload }} rset set
    /powerDistribution/1/outlets/{{ item.id }}/settings/automaticSwitchOnDelay
    {{ item.delay }}
  loop: "{{ pdu_outlets_full }}"
  when: item.delay is defined
  register: outlet_delay_result
  changed_when: outlet_delay_result.rc == 0
  failed_when: outlet_delay_result.rc != 0
  delegate_to: localhost

- name: Set startup state for each outlet
  ansible.builtin.shell: >-
    {{ eaton_payload }} rset set
    /powerDistribution/1/outlets/{{ item.id }}/settings/stateOnStartup
    {{ item.state }}
  loop: "{{ pdu_outlets_full }}"
  when: item.state is defined
  register: outlet_state_result
  changed_when: outlet_state_result.rc == 0
  failed_when: outlet_state_result.rc != 0
  delegate_to: localhost

# ==========================================================================
# 4. VERIFY — read back what was actually written and compare to desired
# ==========================================================================
- name: Include post-configuration verification
  ansible.builtin.include_tasks: verify_outlet_settings.yml



  ---
# pdu_outlet/tasks/validate.yml
# Verifies stateOnStartup and automaticSwitchOnDelay match the configured
# values in host_vars 'outlet' list, after apply.yml has run.

- name: Get current stateOnStartup for each outlet
  ansible.builtin.command: >
    {{ rset_cli }} outlet {{ item.id }} get stateOnStartup
    -i {{ pdu_ip }} -u {{ pdu_user }} -p {{ pdu_pass }}
  loop: "{{ outlet }}"
  loop_control:
    label: "outlet {{ item.id }}"
  register: outlet_startup_state_check
  changed_when: false

- name: Get current automaticSwitchOnDelay for each outlet
  ansible.builtin.command: >
    {{ rset_cli }} outlet {{ item.id }} get automaticSwitchOnDelay
    -i {{ pdu_ip }} -u {{ pdu_user }} -p {{ pdu_pass }}
  loop: "{{ outlet }}"
  loop_control:
    label: "outlet {{ item.id }}"
  register: outlet_startup_delay_check
  changed_when: false

- name: Build validation results per outlet
  ansible.builtin.set_fact:
    outlet_validation_results: >-
      {{ outlet_validation_results | default([]) + [{
        'id': item.0.item.id,
        'expected_state': item.0.item.stateOnStartup,
        'actual_state': item.0.stdout | trim,
        'state_match': (item.0.stdout | trim == item.0.item.stateOnStartup | string),
        'expected_delay': item.1.item.automaticSwitchOnDelay,
        'actual_delay': item.1.stdout | trim,
        'delay_match': (item.1.stdout | trim == item.1.item.automaticSwitchOnDelay | string)
      }] }}
  loop: "{{ outlet_startup_state_check.results | zip(outlet_startup_delay_check.results) | list }}"
  loop_control:
    label: "outlet {{ item.0.item.id }}"

- name: Display validation results
  ansible.builtin.debug:
    var: outlet_validation_results

- name: Fail if any outlet startup config does not match expected values
  ansible.builtin.assert:
    that:
      - item.state_match
      - item.delay_match
    fail_msg: >-
      Outlet {{ item.id }} mismatch — expected stateOnStartup={{ item.expected_state }}
      (got {{ item.actual_state }}), automaticSwitchOnDelay={{ item.expected_delay }}
      (got {{ item.actual_delay }})
    success_msg: "Outlet {{ item.id }} validated: stateOnStartup and automaticSwitchOnDelay match"
  loop: "{{ outlet_validation_results }}"
  loop_control:
    label: "outlet {{ item.id }}"