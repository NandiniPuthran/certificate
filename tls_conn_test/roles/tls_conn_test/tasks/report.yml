---
- name: Report | Per-host results
  ansible.builtin.debug:
    msg: "{{ '%-11s %-30s %s' | format(item.status, item.id, item.detail) }}"
  loop: "{{ tls_test_results }}"
  loop_control:
    label: "{{ item.id }}"

- name: Report | Ensure report directory exists on controller
  ansible.builtin.file:
    path: "{{ tls_test_report_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

# Covers the FULL matrix for every site, including sites not in this run.
# No timestamp in the content, so the task only reports "changed" when results change.
- name: Report | Write consolidated report on controller
  ansible.builtin.copy:
    dest: "{{ tls_test_report_dir }}/tls_connectivity_report.txt"
    mode: "0644"
    content: |
      {{ '%-12s %-30s %-8s %-32s %s' | format('STATUS', 'CASE', 'SOURCE', 'TARGET', 'DETAIL') }}
      {% set all_results = ansible_play_hosts_all | map('extract', hostvars) | map(attribute='tls_test_results', default=[]) | flatten(levels=1) %}
      {% for c in tls_test_all_cases %}
      {% set res = all_results | selectattr('id', 'equalto', c.id) | list %}
      {% set r = res[0] if res else ({'status': 'SKIPPED', 'detail': c.skip_reason} if not c.enabled else {'status': 'NOT RUN', 'detail': 'source site not in this run, or phase not selected'}) %}
      {{ '%-12s %-30s %-8s %-32s %s' | format(r.status, c.id, c.source, c.target ~ ':' ~ c.port, r.detail) }}
      {% endfor %}
  delegate_to: localhost
  become: false
  run_once: true

- name: Report | Fail if any enabled case did not pass
  ansible.builtin.assert:
    that: _bad | length == 0
    fail_msg: "{{ _bad | length }} case(s) failed: {{ _bad | map(attribute='id') | join(', ') }}"
    success_msg: >-
      {{ tls_test_results | selectattr('status', 'equalto', 'PASS') | list | length }} passed,
      {{ tls_test_results | selectattr('status', 'equalto', 'SKIPPED') | list | length }} pending (skipped)
  vars:
    _bad: "{{ tls_test_results | selectattr('status', 'in', ['FAIL', 'UNREACHABLE']) | list }}"
