---
# One test case. Loop var: tls_case (already merged with tls_test_case_defaults)

- name: "{{ tls_case.id }} | Look up preflight result"
  ansible.builtin.set_fact:
    _tls_reach: "{{ (tls_test_reachability | default({}))[tls_case.id] | default('unchecked') }}"

- name: "{{ tls_case.id }} | Probe with openssl s_client"
  ansible.builtin.shell: |
    set -o pipefail
    {% if tls_case.reject_check == 'request' %}
    { printf 'GET %s HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n' {{ tls_case.request_path | quote }} {{ tls_case.target | quote }}; sleep {{ tls_test_hold_seconds }}; } |
    {% else %}
    sleep {{ tls_test_hold_seconds }} |
    {% endif %}
    timeout {{ tls_test_timeout }} openssl s_client \
      -connect {{ (tls_case.target ~ ':' ~ tls_case.port) | quote }} \
      -servername {{ tls_case.target | quote }} \
      -verify_hostname {{ tls_case.target | quote }} \
      -verify_return_error \
      -CAfile {{ (tls_test_ca_file if tls_case.trust == 'ca' else tls_test_tmpdir.path ~ '/selfsigned.crt') | quote }} \
    {% if tls_case.mode == 'mtls' and tls_case.client_cert == 'valid' %}
      -cert {{ tls_test_client_cert | quote }} -key {{ tls_test_client_key | quote }} \
    {% elif tls_case.mode == 'mtls' and tls_case.client_cert == 'selfsigned' %}
      -cert {{ (tls_test_tmpdir.path ~ '/selfsigned.crt') | quote }} -key {{ (tls_test_tmpdir.path ~ '/selfsigned.key') | quote }} \
    {% endif %}
      {{ tls_case.extra_args }} 2>&1
  args:
    executable: /bin/bash
  register: _tls_probe
  changed_when: false
  failed_when: false
  when:
    - tls_case.enabled | bool
    - _tls_reach in ['ok', 'unchecked']

# Pass rules:
#   rejected = a TLS reject alert, or (reject_check: request) an HTTP
#              certificate-error page / reject status code from the server.
#              "close notify" alerts are normal shutdown, NOT a rejection.
#   success            "Verification: OK" and NOT rejected, and
#                        handshake: connection held for tls_test_hold_seconds, not dropped
#                        request:   the server answered the request (any HTTP status)
#                      ("Verification: OK" only means the client trusted the server.)
#   server_reject      "Verification: OK" (so the refusal came from the server) AND rejected
#   client_verify_fail "Verification error: ..." (client did not trust the server)
- name: "{{ tls_case.id }} | Record result"
  ansible.builtin.set_fact:
    tls_test_results: "{{ tls_test_results + [_result] }}"
  vars:
    _out: "{{ _tls_probe.stdout | default('') }}"
    _verify_ok: "{{ _out is search('^Verification: OK', multiline=True) }}"
    _verify_err: "{{ _out is search('^Verification error:', multiline=True) }}"
    _verify_line: "{{ _out | regex_search('^Verification( error)?:.*$', multiline=True) | default('', true) }}"
    _alert: "{{ _out | regex_search(tls_test_reject_alert_regex, ignorecase=True) | default('', true) }}"
    _conn_err: "{{ _out | regex_search(tls_test_conn_error_regex, ignorecase=True) | default('', true) }}"
    _is_request: "{{ tls_case.reject_check == 'request' }}"
    # not anchored to line start: s_client can print the response on the same
    # line as the tail of its session-ticket hex dump
    _http_status: "{{ _out | regex_search('HTTP/[0-9.]+ [0-9]{3}') | default('', true) }}"
    _http_code: "{{ (_http_status.split() | last) if _http_status else '' }}"
    _body_reject: >-
      {{ (_out | regex_search(tls_test_reject_body_regex, ignorecase=True) | default('', true))
         if _is_request | bool else '' }}
    _rejected: >-
      {{ _alert != '' or _body_reject != ''
         or (_is_request | bool and _http_code in (tls_test_reject_http_codes | map('string') | list)) }}
    _passed: >-
      {{ (_verify_ok | bool and not _rejected | bool and
          ((_http_status != '') if _is_request | bool else (_conn_err == '')))
         if tls_case.expect == 'success' else
         (_verify_ok | bool and _rejected | bool)
         if tls_case.expect == 'server_reject' else
         (_verify_err | bool) }}
    _status: >-
      {{ 'SKIPPED' if not tls_case.enabled | bool else
         ('UNREACHABLE' if _tls_reach not in ['ok', 'unchecked'] else
         ('PASS' if _passed | bool else 'FAIL')) }}
    _detail: >-
      {%- if not tls_case.enabled | bool -%}{{ tls_case.skip_reason | default('disabled') }}
      {%- elif _tls_reach == 'dns' -%}DNS resolution failed for {{ tls_case.target }}
      {%- elif _tls_reach == 'tcp' -%}TCP connect failed to {{ tls_case.target }}:{{ tls_case.port }}
      {%- else -%}expect={{ tls_case.expect }} | {{ _verify_line or 'no verification result' }}{{ (' | ' ~ _alert) if _alert else '' }}{{ (' | ' ~ _http_status) if _http_status else '' }}{{ (' "' ~ _body_reject ~ '"') if _body_reject else '' }}{{ (' | ' ~ _conn_err) if _conn_err else '' }} | rc={{ _tls_probe.rc | default('-') }}
      {%- endif -%}
    _result:
      id: "{{ tls_case.id }}"
      source: "{{ tls_test_site }}"
      host: "{{ inventory_hostname }}"
      target: "{{ tls_case.target }}:{{ tls_case.port }}"
      mode: "{{ tls_case.mode }}"
      reject_check: "{{ tls_case.reject_check }}"
      expect: "{{ tls_case.expect }}"
      status: "{{ _status }}"
      detail: "{{ _detail }}"
