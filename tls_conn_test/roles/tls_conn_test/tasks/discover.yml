---
# Read-only discovery. For each enabled endpoint this site calls, make ONE
# connection with the valid client cert and send `GET <http_path>`.
# Never fails the play - it only tells you where http_check: true is safe.
- name: Discover | Probe endpoints for an HTTP response
  ansible.builtin.shell: |
    set -o pipefail
    printf 'GET %s HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n' {{ item.http_path | quote }} {{ item.target | quote }} |
    timeout {{ tls_test_timeout }} openssl s_client \
      -connect {{ (item.target ~ ':' ~ item.port) | quote }} \
      -servername {{ item.target | quote }} \
      -CAfile {{ tls_test_ca_file | quote }} \
    {% if item.mode == 'mtls' %}
      -cert {{ tls_test_client_cert | quote }} -key {{ tls_test_client_key | quote }} \
    {% endif %}
      -ign_eof 2>&1
  args:
    executable: /bin/bash
  loop: >-
    {{ tls_test_my_cases | selectattr('enabled') | selectattr('kind', 'equalto', 'valid')
       | rejectattr('id', 'in', _tls_unreachable_ids) | list }}
  loop_control:
    label: "{{ item.endpoint }} {{ item.target }}:{{ item.port }}{{ item.http_path }}"
  vars:
    _tls_unreachable_ids: >-
      {{ (tls_test_reachability | default({})) | dict2items
         | rejectattr('value', 'equalto', 'ok') | map(attribute='key') | list }}
  register: _tls_discover
  changed_when: false
  failed_when: false

- name: Discover | Result per endpoint
  ansible.builtin.debug:
    msg: >-
      {{ '%-24s %-40s %s' | format(item.item.endpoint, item.item.target ~ ':' ~ item.item.port ~ item.item.http_path,
         ('HTTP ' ~ _code ~ ' -> set http_check: true') if _code == (tls_test_expected_http_status | string) else
         ('HTTP ' ~ _code ~ ' -> speaks HTTP, but check http_path / expected status') if _code != '000' else
         'no HTTP response -> keep handshake-only (http_check: false)') }}
  loop: "{{ _tls_discover.results }}"
  loop_control:
    label: "{{ item.item.endpoint }}"
  vars:
    _code: "{{ (item.stdout | default('') | regex_search('HTTP/[0-9.]+ [0-9]{3}') | default('none 000', true)).split() | last }}"
