---
# roles/certificate_renewal/tasks/renew.yml
# Full renewal workflow: backup → keygen → CSR → sign → deploy

# ─── 1. Backup existing certificate ──────────────────────────────────────────
- name: Backup existing certificate (if present)
  ansible.builtin.copy:
    src: "{{ cert_file }}"
    dest: "{{ cert_backup_dir }}/{{ cert_cn }}.crt.{{ _renewal_timestamp }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when:
    - cert_backup_enabled | bool
    - _cert_stat.stat.exists

- name: Backup existing key (if present)
  ansible.builtin.copy:
    src: "{{ cert_key_file }}"
    dest: "{{ cert_backup_dir }}/{{ cert_cn }}.key.{{ _renewal_timestamp }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - cert_backup_enabled | bool
    - _cert_stat.stat.exists

# ─── 2. Generate private key ──────────────────────────────────────────────────
- name: Generate private key
  community.crypto.openssl_privatekey:
    path: "{{ cert_key_file }}"
    type: "{{ cert_key_type }}"
    size: "{{ cert_key_size | int }}"
    owner: root
    group: root
    mode: "0600"
    state: present
    force: "{{ renewal_force | bool }}"

# ─── 3. Generate CSR ──────────────────────────────────────────────────────────
- name: Build SAN list
  ansible.builtin.set_fact:
    _cert_san_list: >-
      {{
        (cert_san_dns | default([cert_cn]) | map('regex_replace', '^', 'DNS:') | list)
        + (cert_san_ip | default([]) | map('regex_replace', '^', 'IP:') | list)
      }}

- name: Generate CSR
  community.crypto.openssl_csr:
    path: "{{ cert_csr_file }}"
    privatekey_path: "{{ cert_key_file }}"
    common_name: "{{ cert_cn }}"
    subject_alt_name: "{{ _cert_san_list }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
      - clientAuth
    owner: root
    group: root
    mode: "0644"
    state: present
    force: "{{ renewal_force | bool }}"

# ─── 4. Prepare signing host staging directories ──────────────────────────────
- name: Ensure staging directories exist on IPA signing host
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ ipa_signing_host }}"
  loop:
    - "{{ ipa_signing_csr_dir }}"
    - "{{ ipa_signing_cert_dir }}"

# ─── 5. Copy CSR to signing host ─────────────────────────────────────────────
- name: Fetch CSR from target host
  ansible.builtin.slurp:
    src: "{{ cert_csr_file }}"
  register: _csr_content

- name: Copy CSR to IPA signing host
  ansible.builtin.copy:
    content: "{{ _csr_content.content | b64decode }}"
    dest: "{{ _ipa_csr_remote }}"
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ ipa_signing_host }}"

# ─── 6. Submit CSR to FreeIPA and retrieve signed cert ───────────────────────
- name: Submit CSR to FreeIPA CA
  ansible.builtin.command:
    cmd: >
      kinit -kt /etc/krb5.keytab
      && ipa cert-request
        --principal host/{{ cert_cn }}@{{ ipa_realm }}
        --profile-id {{ cert_profile }}
        --certificate-out {{ _ipa_cert_remote | quote }}
        {{ _ipa_csr_remote | quote }}
  delegate_to: "{{ ipa_signing_host }}"
  register: _ipa_cert_request
  changed_when: _ipa_cert_request.rc == 0
  failed_when: _ipa_cert_request.rc != 0
  no_log: false

- name: Ensure signed certificate exists on signing host
  ansible.builtin.stat:
    path: "{{ _ipa_cert_remote }}"
  delegate_to: "{{ ipa_signing_host }}"
  register: _signed_cert_stat
  failed_when: not _signed_cert_stat.stat.exists

# ─── 7. Fetch signed certificate back to controller, push to target ───────────
- name: Slurp signed certificate from signing host
  ansible.builtin.slurp:
    src: "{{ _ipa_cert_remote }}"
  delegate_to: "{{ ipa_signing_host }}"
  register: _signed_cert_content

- name: Deploy signed certificate to target host
  ansible.builtin.copy:
    content: "{{ _signed_cert_content.content | b64decode }}"
    dest: "{{ cert_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: "{{ cert_consumers | map('regex_replace', '^', 'reload_') | list }}"

# ─── 8. Deploy CA bundle ──────────────────────────────────────────────────────
- name: Ensure CA bundle directory exists
  ansible.builtin.file:
    path: "{{ ca_bundle_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch IPA CA certificate from signing host
  ansible.builtin.slurp:
    src: "{{ ipa_ca_cert_path }}"
  delegate_to: "{{ ipa_signing_host }}"
  register: _ipa_ca_content

- name: Deploy IPA CA bundle to target host
  ansible.builtin.copy:
    content: "{{ _ipa_ca_content.content | b64decode }}"
    dest: "{{ ca_bundle_path }}"
    owner: root
    group: root
    mode: "0644"

# ─── 9. Cleanup staging on signing host ──────────────────────────────────────
- name: Remove CSR from signing host
  ansible.builtin.file:
    path: "{{ _ipa_csr_remote }}"
    state: absent
  delegate_to: "{{ ipa_signing_host }}"

- name: Remove signed cert from signing host staging dir
  ansible.builtin.file:
    path: "{{ _ipa_cert_remote }}"
    state: absent
  delegate_to: "{{ ipa_signing_host }}"

# ─── 10. Validate deployed certificate ───────────────────────────────────────
- name: Validate deployed certificate
  ansible.builtin.include_tasks: validate_renewal.yml


---
# Runs on the IT server. Deploys the revoke hook once, then starts
# certmonger tracking per managed certificate with that hook wired in
# as the post-renewal command.
#
# Reminder: certmonger's ipa-submit authenticates using the IT server's
# OWN default keytab (/etc/krb5.keytab) - the -K principal below is who
# the cert is being requested FOR, not who's authenticating. This only
# succeeds if that principal already has the IT server listed as a
# managing host (ipa_service_managed_host role, managing_hosts including
# {{ it_server }}).

- name: Ensure the cert_manager bin directory exists
  ansible.builtin.file:
    path: "{{ revoke_script_path | dirname }}"
    state: directory
    mode: "0755"
  become: true

- name: Deploy the revoke-superseded hook script
  ansible.builtin.copy:
    src: revoke_superseded.sh
    dest: "{{ revoke_script_path }}"
    mode: "0750"
    owner: root
    group: root
  become: true

- name: Ensure the revoke log directory exists
  ansible.builtin.file:
    path: "{{ revoke_log_path | dirname }}"
    state: directory
    mode: "0750"
  become: true

- name: Confirm revoke_principal is set before tracking anything
  ansible.builtin.assert:
    that: revoke_principal | length > 0
    fail_msg: >-
      revoke_principal is unset - the post-renewal hook would kinit
      with an empty principal and every revoke would fail, silently
      logged only to revoke.log. Set it explicitly before running this.

# Single flat loop over managed_certificates throughout - each item
# here is always the original dict (name, principal, cert_path, ...),
# never a nested result object, so downstream references stay
# item.<field> everywhere below.

- name: Check tracking status per certificate
  ansible.builtin.command: "getcert list -f {{ item.cert_path }}"
  loop: "{{ managed_certificates }}"
  loop_control:
    label: "{{ item.name }}"
    loop_var: item
  register: tracking_check
  changed_when: false
  failed_when: false

- name: Build a name-keyed already-tracked map
  ansible.builtin.set_fact:
    already_tracked_map: "{{ dict(managed_certificates | map(attribute='name') | zip(tracking_check.results | map(attribute='stdout') | map('regex_search', 'MONITORING') | map('bool'))) }}"

- name: Start tracking each certificate not already tracked
  ansible.builtin.command: >
    ipa-getcert start-tracking
    -c {{ tracking_ca }}
    -f {{ item.cert_path }}
    -k {{ item.key_path }}
    -K {{ item.principal }}
    -C "{{ revoke_script_path }} {{ item.cert_path }} {{ item.serial_path }} {{ revoke_keytab_path }} {{ revoke_principal }} {{ revocation_reason }}"
  loop: "{{ managed_certificates }}"
  loop_control:
    label: "{{ item.name }}"
    loop_var: item
  when: not already_tracked_map[item.name]
  become: true
  register: start_tracking_results

- name: Report tracking outcome
  ansible.builtin.debug:
    msg: >-
      {{ item.name }}:
      {{ 'already tracked, skipped' if already_tracked_map[item.name]
      else 'tracking started' }}
  loop: "{{ managed_certificates }}"
  loop_control:
    label: "{{ item.name }}"
    loop_var: item
