---
# Asserts that renewal is happening, and happened correctly.
#
# Deliberately narrow. Everything about whether the CURRENT certificate set is
# correct — parses, matches its key and CSR, right CN and SAN, right EKU, inside
# its validity window, permissions — is asserted in generate.yml against exactly
# the same data. Repeating it here would double the run time and produce two
# failures for one fault.
#
# What is left is what only renewal can be judged on:
#   - evidence that a renewal produced a better certificate than the one it
#     replaced, using the backup left beside it
#   - the serial file that renewal overwrites
#   - certmonger tracking, which is what makes the next renewal happen
#
# NOT tested: whether renewal should have fired by now. The threshold and
# trigger are not decided, so there is nothing to assert against — a test
# written now would encode a guess rather than a requirement.

# ─────────────────────────────────────────────────────────────────────────────
# Evidence of the last renewal
#
# The comparisons below run only where a backup exists. A host that has never
# renewed is a legitimate state, not a failure, so it gets a note instead.
# ─────────────────────────────────────────────────────────────────────────────

- name: Report certificates that have not been renewed yet
  ansible.builtin.debug:
    msg: >-
      No {{ item.base }}{{ tc_backup_glob }} in {{ item.dir }} — this
      certificate has never been renewed, so the comparison tests are skipped
      for it. Expected on a newly provisioned host.
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  when: item.name not in (tc_prev_by_name | default({}))

- name: Renewal produced a new serial number
  ansible.builtin.assert:
    that: (item.serial_number | int) != (tc_prev_by_name[item.item.name].serial_number | int)
    fail_msg: >-
      {{ item.item.crt }} carries serial {{ item.serial_number }}, the same as
      the most recent backup. The file was replaced but the certificate was
      never reissued.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }
  when: item.item.name in (tc_prev_by_name | default({}))

- name: Renewed certificate starts later than the one it replaced
  ansible.builtin.assert:
    that: item.not_before > tc_prev_by_name[item.item.name].not_before
    fail_msg: >-
      {{ item.item.crt }} has notBefore {{ item.not_before }}, not later than
      the previous {{ tc_prev_by_name[item.item.name].not_before }}. The
      deployed certificate is older than the one it replaced.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }
  when: item.item.name in (tc_prev_by_name | default({}))

- name: Renewed certificate expires later than the one it replaced
  ansible.builtin.assert:
    that: item.not_after > tc_prev_by_name[item.item.name].not_after
    fail_msg: >-
      {{ item.item.crt }} expires {{ item.not_after }}, not later than the
      previous {{ tc_prev_by_name[item.item.name].not_after }}. Renewal gained
      no additional validity.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }
  when: item.item.name in (tc_prev_by_name | default({}))

- name: Subject CN is unchanged across renewal
  ansible.builtin.assert:
    that:
      - (item.subject.commonName | lower)
        == (tc_prev_by_name[item.item.name].subject.commonName | lower)
    fail_msg: >-
      {{ item.item.crt }} CN changed across renewal, from
      '{{ tc_prev_by_name[item.item.name].subject.commonName }}' to
      '{{ item.subject.commonName }}'.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }
  when: item.item.name in (tc_prev_by_name | default({}))

- name: SANs are unchanged across renewal
  ansible.builtin.assert:
    that:
      - (item.subject_alt_name | default([]) | map('lower') | sort | list)
        == (tc_prev_by_name[item.item.name].subject_alt_name | default([])
            | map('lower') | sort | list)
    fail_msg: >-
      {{ item.item.crt }} SANs changed across renewal. Was
      [{{ (tc_prev_by_name[item.item.name].subject_alt_name | default([])) | join(', ') }}],
      now [{{ (item.subject_alt_name | default([])) | join(', ') }}].
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }
  when: item.item.name in (tc_prev_by_name | default({}))

# ─────────────────────────────────────────────────────────────────────────────
# The serial file
#
# Renewal overwrites this with the new serial. If it disagrees with the
# certificate, anything downstream keying off the file is working from a serial
# that is no longer deployed.
# ─────────────────────────────────────────────────────────────────────────────

- name: Serial file exists
  ansible.builtin.assert:
    that: not (item.failed | bool)
    fail_msg: >-
      {{ item.item.serial }} could not be read. Either renewal did not write it,
      or tc_serial_suffix ('{{ tc_serial_suffix }}') does not match the real
      filename.
    quiet: true
  loop: "{{ tc_serial.results | default([]) }}"
  loop_control: {label: "{{ item.item.name | default('skipped') }}" }
  when: item.item is defined

# The file may hold the serial in decimal or hex, with or without colons, 0x, or
# leading zeros. Rather than guess, the certificate's serial is rendered in both
# forms and the normalised file content matched against the pair. Parsing with
# int(base=0) does NOT work: a hex serial like "0400" reads as ambiguous octal
# and raises.
- name: Serial file matches the deployed certificate
  ansible.builtin.assert:
    that: _file_serial in _cert_serial_forms
    fail_msg: >-
      {{ item.0.item.serial }} holds '{{ _file_serial }}' but
      {{ item.0.item.crt }} carries serial {{ item.0.serial_number }}
      (hex {{ '%x' | format(item.0.serial_number | int) }}). The serial file was
      not updated by the last renewal.
    quiet: true
  vars:
    _file_serial: >-
      {{ (item.1.content | default('') | b64decode | trim | lower
          | replace(':', '') | replace(' ', ''))
         | regex_replace('^0x', '') | regex_replace('^0+(?=.)', '') }}
    _cert_serial_forms:
      - "{{ item.0.serial_number | int }}"
      - "{{ '%x' | format(item.0.serial_number | int) }}"
  loop: "{{ tc_crt.results | zip(tc_serial.results | default([])) | list }}"
  loop_control: {label: "{{ item.0.item.name }}" }
  when:
    - item.1.item is defined
    - not (item.0.failed | bool)
    - not (item.1.failed | bool)

# ─────────────────────────────────────────────────────────────────────────────
# certmonger tracking
#
# This is what makes the NEXT renewal happen. A certificate can be perfectly
# healthy today and still be guaranteed to expire, if nothing is tracking it.
# ─────────────────────────────────────────────────────────────────────────────

- name: A certmonger request tracks this certificate
  ansible.builtin.assert:
    that: (tc_cm[item.name] | default('') | length) > 0
    fail_msg: >-
      No certmonger request on {{ tc_ipa_host }} references {{ item.crt }}.
      Nothing will renew it — it will simply expire, with no warning.
    quiet: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }

- name: Tracking request is in MONITORING state
  ansible.builtin.assert:
    that:
      - (((tc_cm[item.name] | regex_findall('(?im)^[ \t]*status[ \t]*:[ \t]*(\S+)')) + [''])
         | first | upper) == 'MONITORING'
    fail_msg: >-
      certmonger status for {{ item.crt }} is
      '{{ ((tc_cm[item.name] | regex_findall('(?im)^[ \t]*status[ \t]*:[ \t]*(\S+)')) + ['none']) | first }}',
      expected MONITORING.
    quiet: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  when: (tc_cm[item.name] | default('') | length) > 0

- name: Tracking request is not stuck
  ansible.builtin.assert:
    that:
      - (((tc_cm[item.name] | regex_findall('(?im)^[ \t]*stuck[ \t]*:[ \t]*(\S+)')) + ['yes'])
         | first | lower) == 'no'
    fail_msg: >-
      The certmonger request for {{ item.crt }} is stuck. Renewal will not
      complete without someone intervening on {{ tc_ipa_host }}.
    quiet: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  when: (tc_cm[item.name] | default('') | length) > 0

# The silent failure: certmonger renews on the IT server and nothing ever pushes
# the result out. No error is raised anywhere; the host just expires.
- name: Tracking request has a post-save command
  ansible.builtin.assert:
    that:
      - (((tc_cm[item.name] | regex_findall('(?im)^[ \t]*post-save command[ \t]*:[ \t]*(.+?)[ \t]*$')) + [''])
         | first | trim | length) > 0
    fail_msg: >-
      The certmonger request for {{ item.crt }} has no post-save command.
      certmonger will renew it on {{ tc_ipa_host }} and never distribute it.
    quiet: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  when: (tc_cm[item.name] | default('') | length) > 0
