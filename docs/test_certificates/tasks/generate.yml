---
# Did cert_generate produce a correct key and certificate?

- name: "TC-GEN-001: private key exists"
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item.key_path }} is missing."
    quiet: true
  loop: "{{ tc_key_stat.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: "TC-GEN-002: key type and size meet policy"
  ansible.builtin.assert:
    that:
      - (item.public_key_type | lower) != 'rsa' or (item.public_key_data.size | int) >= (tc_min_key_bits | int)
    fail_msg: >-
      {{ item.public_key_type }} key is {{ item.public_key_data.size }} bits,
      minimum is {{ tc_min_key_bits }}.
    quiet: true
  loop: "{{ tc_cert_info.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: "TC-GEN-003: key mode and owner correct"
  ansible.builtin.assert:
    that:
      - (item.item.key_mode is not defined) or (item.stat.mode == item.item.key_mode)
      - (item.item.owner is not defined) or (item.stat.pw_name == item.item.owner)
    fail_msg: >-
      {{ item.item.key_path }} is {{ item.stat.mode }} owned by
      {{ item.stat.pw_name }}, expected {{ item.item.key_mode | default('?') }}
      owned by {{ item.item.owner | default('?') }}.
    quiet: true
  loop: "{{ tc_key_stat.results | selectattr('stat.exists') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: "TC-GEN-004: key is not world-readable"
  ansible.builtin.assert:
    that: (item.stat.mode | int(base=8)) % 8 == 0
    fail_msg: >-
      {{ item.item.key_path }} is mode {{ item.stat.mode }} — readable by every
      user on the host.
    quiet: true
  loop: "{{ tc_key_stat.results | selectattr('stat.exists') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: "TC-GEN-007: certificate exists at the managed path"
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item.cert_path }} is missing. Generation or distribution never
      completed for '{{ item.item.name }}'.
    quiet: true
  loop: "{{ tc_cert_stat.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: "TC-GEN-008: certificate and key are a matching pair"
  ansible.builtin.assert:
    that:
      - not (item.1.failed | default(true))
      - item.1.public_key_fingerprints.sha256 == item.0.public_key_fingerprints.sha256
    fail_msg: >-
      The key at {{ item.0.item.key_path }} does not match the certificate at
      {{ item.0.item.cert_path }} — they are not a pair.
    quiet: true
  loop: "{{ tc_pairs }}"
  loop_control: {label: "{{ item.0.item.name }}"}

- name: "TC-GEN-009: subject CN matches the request"
  ansible.builtin.assert:
    that: item.subject.commonName == item.item.expected_cn
    fail_msg: "Subject CN is '{{ item.subject.commonName }}', expected '{{ item.item.expected_cn }}'."
    quiet: true
  loop: "{{ tc_cert_info.results }}"
  loop_control: {label: "{{ item.item.name }}"}
  when: item.item.expected_cn is defined

- name: "TC-GEN-010: all required SANs are present"
  ansible.builtin.assert:
    that: (item.item.expected_san | difference(item.subject_alt_name | default([]))) | length == 0
    fail_msg: >-
      Missing SANs:
      {{ item.item.expected_san | difference(item.subject_alt_name | default([])) | join(', ') }}.
      Present: {{ (item.subject_alt_name | default([])) | join(', ') }}.
    quiet: true
  loop: "{{ tc_cert_info.results }}"
  loop_control: {label: "{{ item.item.name }}"}
  when: item.item.expected_san is defined

- name: "TC-GEN-011: signature algorithm is approved"
  ansible.builtin.assert:
    that: item.signature_algorithm in tc_allowed_sig_algs
    fail_msg: >-
      Signature algorithm '{{ item.signature_algorithm }}' is not approved.
      Check the IPA certificate profile.
    quiet: true
  loop: "{{ tc_cert_info.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: "TC-GEN-012: TLS certificates carry the serverAuth EKU"
  ansible.builtin.assert:
    that:
      - ('TLS Web Server Authentication' in (item.extended_key_usage | default([])))
        or ('serverAuth' in (item.extended_key_usage | default([])))
    fail_msg: >-
      This certificate serves TLS on port {{ item.item.tls_port }} but has no
      serverAuth EKU. Present: {{ (item.extended_key_usage | default([])) | join(', ') }}.
    quiet: true
  loop: "{{ tc_cert_info.results }}"
  loop_control: {label: "{{ item.item.name }}"}
  when: item.item.tls_port is defined

- name: "TC-GEN-013: validity period matches the profile"
  ansible.builtin.assert:
    that:
      - (((item.not_after | to_datetime(tc_time_format))
          - (item.not_before | to_datetime(tc_time_format))).days
         - (tc_expected_validity_days | int)) | abs <= (tc_validity_tolerance_days | int)
    fail_msg: >-
      Validity is
      {{ ((item.not_after | to_datetime(tc_time_format)) - (item.not_before | to_datetime(tc_time_format))).days }}
      days, expected {{ tc_expected_validity_days }}
      (+/- {{ tc_validity_tolerance_days }}). The profile may have changed.
    quiet: true
  loop: "{{ tc_cert_info.results }}"
  loop_control: {label: "{{ item.item.name }}"}
  when: (tc_expected_validity_days | int) > 0
  ignore_errors: true    # WARN severity in the spec

- name: "TC-GEN-014: notBefore is not in the future beyond allowed skew"
  ansible.builtin.assert:
    that:
      - (((item.not_before | to_datetime(tc_time_format)) - now(utc=true)).total_seconds() | float)
        <= (tc_max_clock_skew_seconds | int)
    fail_msg: >-
      notBefore is {{ item.not_before }}, in the future beyond the allowed skew.
      Check NTP on the issuing host.
    quiet: true
  loop: "{{ tc_cert_info.results }}"
  loop_control: {label: "{{ item.item.name }}"}
  ignore_errors: true    # WARN severity in the spec

- name: "TC-GEN-015: certificate is inside its validity window"
  ansible.builtin.assert:
    that:
      - item.valid_at.now
      - not item.expired
    fail_msg: >-
      Certificate is not valid now (notBefore {{ item.not_before }},
      notAfter {{ item.not_after }}).
    quiet: true
  loop: "{{ tc_cert_info.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: "TC-GEN-016: an IPA host entry exists for this host"
  ansible.builtin.assert:
    that: tc_ipa_host_show.rc == 0
    fail_msg: >-
      IPA has no host entry for {{ ansible_facts['fqdn'] }}. Certificates cannot
      be issued or renewed against a principal that does not exist.
    quiet: true
  when: tc_online | bool

- name: "TC-GEN-021: no CSR or key material left in scratch directories"
  ansible.builtin.assert:
    that: (tc_leftovers.files | default([])) | length == 0
    fail_msg: >-
      Key or CSR material left behind:
      {{ (tc_leftovers.files | default([]) | map(attribute='path') | list)[:10] | join(', ') }}
    quiet: true
