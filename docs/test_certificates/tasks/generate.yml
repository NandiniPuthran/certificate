---
# Certificate generation tests.
#
# Self-contained — it does its own collection, so it runs before gather.yml
# exists. Run with:  ansible-playbook -i <inv> test_certificates.yml --tags generate
#
# Generation is a three-link chain:
#
#   controller: key -> CSR        Stage 1
#   copy to IT server             Stage 2
#   IT server: CSR -> certificate Stage 3
#
# The chain is what gets tested. "A certificate exists and looks valid" is true
# even when a stale CSR got signed, or another host's did.

# ─────────────────────────────────────────────────────────────────────────────
# Which certificates this host should have
# ─────────────────────────────────────────────────────────────────────────────

- name: Work out which certificates belong to this host
  ansible.builtin.set_fact:
    tc_units: >-
      {{ tc_host_units
         + (tc_mok_units if (tc_mok_group in group_names) else []) }}
    tc_is_itserver: "{{ inventory_hostname == tc_ipa_host }}"

# Globals live at the root of the certificate directory, carry the IT server's
# identity, and go through the same three stages — so they are tested as extra
# units when the play reaches the IT server, not as a separate pipeline.
- name: Add the global certificates when this host is the IT server
  ansible.builtin.set_fact:
    tc_units: >-
      {{ tc_units + (tc_global_units
         | map('combine', {'global': true}) | list) }}
  when: tc_is_itserver | bool

- name: Build the file paths for each unit
  ansible.builtin.set_fact:
    tc_files: >-
      {{ tc_files | default([]) + [{
           'name': item.name,
           'eku': item.eku | default(''),
           'global': item.global | default(false),
           'dir': (tc_cert_root if (item.global | default(false)) else tc_host_dir),
           'key': (tc_cert_root if (item.global | default(false)) else tc_host_dir) ~ '/' ~ item.name ~ '.key',
           'csr': (tc_cert_root if (item.global | default(false)) else tc_host_dir) ~ '/' ~ item.name ~ '.csr',
           'crt': (tc_cert_root if (item.global | default(false)) else tc_host_dir) ~ '/' ~ item.name ~ '.crt',
           'cn':  (hostvars[tc_ipa_host].ansible_facts.fqdn | default(tc_ipa_host))
                  if (item.global | default(false)) else tc_expected_cn,
           'san': ['DNS:' ~ (hostvars[tc_ipa_host].ansible_facts.fqdn | default(tc_ipa_host))]
                  if (item.global | default(false)) else tc_expected_san
         }] }}
  loop: "{{ tc_units }}"
  loop_control: {label: "{{ item.name }}"}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Ansible controller
# ─────────────────────────────────────────────────────────────────────────────

- name: Stat the certificate directory on the controller
  ansible.builtin.stat:
    path: "{{ (tc_files | first).dir if (tc_files | length > 0) else tc_host_dir }}"
  delegate_to: localhost
  become: false
  register: tc_c_dir

- name: Per-host directory exists on the controller
  ansible.builtin.assert:
    that: tc_c_dir.stat.exists and tc_c_dir.stat.isdir
    fail_msg: >-
      {{ tc_host_dir }} does not exist on the controller. Nothing was generated
      for {{ inventory_hostname }}.
    quiet: true

- name: Certificate directory on the controller is not world-traversable
  ansible.builtin.assert:
    that: (tc_c_dir.stat.mode | int(base=8)) % 8 == 0
    fail_msg: >-
      {{ tc_c_dir.stat.path }} is mode {{ tc_c_dir.stat.mode }} on the
      controller. This tree holds the private key for every host in the fleet —
      it must not be traversable by other users.
    quiet: true
  when: tc_c_dir.stat.exists

- name: Stat private keys on the controller
  ansible.builtin.stat:
    path: "{{ item.key }}"
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_c_key_stat

- name: Stat CSRs on the controller
  ansible.builtin.stat:
    path: "{{ item.csr }}"
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_c_csr_stat

- name: Private key exists on the controller
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item.key }} is missing on the controller."
    quiet: true
  loop: "{{ tc_c_key_stat.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: CSR exists on the controller
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item.csr }} is missing on the controller."
    quiet: true
  loop: "{{ tc_c_csr_stat.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Private key on the controller is not readable by other users
  ansible.builtin.assert:
    that: (item.stat.mode | int(base=8)) % 64 == 0
    fail_msg: >-
      {{ item.item.key }} is mode {{ item.stat.mode }} on the controller —
      readable beyond its owner.
    quiet: true
  loop: "{{ tc_c_key_stat.results | selectattr('stat.exists') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Read private keys on the controller
  community.crypto.openssl_privatekey_info:
    path: "{{ item.key }}"
  delegate_to: localhost
  become: false
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_c_key
  failed_when: false

- name: Read CSRs on the controller
  community.crypto.openssl_csr_info:
    path: "{{ item.csr }}"
  delegate_to: localhost
  become: false
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_c_csr
  failed_when: false

- name: Private key parses on the controller
  ansible.builtin.assert:
    that: not (item.failed | default(true))
    fail_msg: "{{ item.item.key }} does not parse as a private key."
    quiet: true
  loop: "{{ tc_c_key.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: CSR parses on the controller
  ansible.builtin.assert:
    that: not (item.failed | default(true))
    fail_msg: "{{ item.item.csr }} does not parse as a CSR."
    quiet: true
  loop: "{{ tc_c_csr.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Private key type and size meet policy
  ansible.builtin.assert:
    that:
      - (item.type | lower) != 'rsa' or (item.public_data.size | int) >= (tc_min_key_bits | int)
    fail_msg: >-
      {{ item.item.key }} is a {{ item.public_data.size }}-bit {{ item.type }}
      key; minimum is {{ tc_min_key_bits }}.
    quiet: true
  loop: "{{ tc_c_key.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: CSR signature is self-consistent
  ansible.builtin.assert:
    that: item.signature_valid
    fail_msg: >-
      {{ item.item.csr }} has an invalid self-signature. It was not produced by
      the key that claims to have signed it.
    quiet: true
  loop: "{{ tc_c_csr.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

# The first link in the chain. A stale CSR left from an earlier run signs the
# wrong public key, and the host ends up with a certificate it has no key for.
- name: CSR public key matches the private key beside it
  ansible.builtin.assert:
    that: item.0.public_key_fingerprints.sha256 == item.1.public_key_fingerprints.sha256
    fail_msg: >-
      {{ item.0.item.csr }} was not built from {{ item.0.item.key }} — the public
      keys differ. One of the two is stale.
    quiet: true
  loop: "{{ tc_c_csr.results | zip(tc_c_key.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}"}
  when:
    - not (item.0.failed | default(true))
    - not (item.1.failed | default(true))

- name: CSR CN matches the expected identity
  ansible.builtin.assert:
    that: item.subject.commonName == item.item.cn
    fail_msg: >-
      {{ item.item.csr }} CN is '{{ item.subject.commonName }}', expected
      '{{ item.item.cn }}'.
    quiet: true
  loop: "{{ tc_c_csr.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: CSR SANs include every expected name
  ansible.builtin.assert:
    that: (item.item.san | difference(item.subject_alt_name | default([]))) | length == 0
    fail_msg: >-
      {{ item.item.csr }} is missing SANs
      {{ item.item.san | difference(item.subject_alt_name | default([])) | join(', ') }}.
      Present: {{ (item.subject_alt_name | default([])) | join(', ') }}.
    quiet: true
  loop: "{{ tc_c_csr.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — after the copy to the IT server
# ─────────────────────────────────────────────────────────────────────────────

- name: Stat the certificate directory on the IT server
  ansible.builtin.stat:
    path: "{{ (tc_files | first).dir if (tc_files | length > 0) else tc_host_dir }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  register: tc_s_dir

- name: Per-host directory exists on the IT server
  ansible.builtin.assert:
    that: tc_s_dir.stat.exists and tc_s_dir.stat.isdir
    fail_msg: >-
      {{ tc_host_dir }} does not exist on {{ tc_ipa_host }}. The copy step never
      ran for {{ inventory_hostname }}.
    quiet: true

- name: Certificate directory on the IT server is not world-traversable
  ansible.builtin.assert:
    that: (tc_s_dir.stat.mode | int(base=8)) % 8 == 0
    fail_msg: >-
      {{ tc_s_dir.stat.path }} is mode {{ tc_s_dir.stat.mode }} on
      {{ tc_ipa_host }}. This tree holds private keys.
    quiet: true
  when: tc_s_dir.stat.exists

- name: Stat private keys on the IT server
  ansible.builtin.stat:
    path: "{{ item.key }}"
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_s_key_stat

- name: Stat CSRs on the IT server
  ansible.builtin.stat:
    path: "{{ item.csr }}"
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_s_csr_stat

- name: Private key is present on the IT server
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item.key }} is missing on {{ tc_ipa_host }}."
    quiet: true
  loop: "{{ tc_s_key_stat.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: CSR is present on the IT server
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item.csr }} is missing on {{ tc_ipa_host }}."
    quiet: true
  loop: "{{ tc_s_csr_stat.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Private key on the IT server is not readable by other users
  ansible.builtin.assert:
    that: (item.stat.mode | int(base=8)) % 64 == 0
    fail_msg: >-
      {{ item.item.key }} is mode {{ item.stat.mode }} on {{ tc_ipa_host }} —
      readable beyond its owner.
    quiet: true
  loop: "{{ tc_s_key_stat.results | selectattr('stat.exists') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

# The second link. A failed copy leaves an older CSR in place, and the IT server
# signs that instead — producing a certificate for the wrong public key.
- name: CSR on the IT server is byte-identical to the controller's copy
  ansible.builtin.assert:
    that: item.0.stat.checksum == item.1.stat.checksum
    fail_msg: >-
      {{ item.0.item.csr }} differs between the controller and {{ tc_ipa_host }}.
      The copy step did not complete, so the CSR being signed is not the one
      that was generated.
    quiet: true
  loop: "{{ tc_c_csr_stat.results | zip(tc_s_csr_stat.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}"}
  when:
    - item.0.stat.exists
    - item.1.stat.exists

- name: Private key on the IT server is byte-identical to the controller's copy
  ansible.builtin.assert:
    that: item.0.stat.checksum == item.1.stat.checksum
    fail_msg: >-
      {{ item.0.item.key }} differs between the controller and {{ tc_ipa_host }}.
    quiet: true
  loop: "{{ tc_c_key_stat.results | zip(tc_s_key_stat.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}"}
  when:
    - item.0.stat.exists
    - item.1.stat.exists

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — after signing on the IT server
# ─────────────────────────────────────────────────────────────────────────────

- name: Stat certificates on the IT server
  ansible.builtin.stat:
    path: "{{ item.crt }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_s_crt_stat

- name: Certificate exists on the IT server
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item.crt }} is missing on {{ tc_ipa_host }}. The CSR was copied but
      never signed.
    quiet: true
  loop: "{{ tc_s_crt_stat.results }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Read certificates on the IT server
  community.crypto.x509_certificate_info:
    path: "{{ item.crt }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_s_crt
  failed_when: false

# Read the CSR as it exists on the IT server — that is the one that was signed.
- name: Read CSRs on the IT server
  community.crypto.openssl_csr_info:
    path: "{{ item.csr }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}"}
  register: tc_s_csr
  failed_when: false

- name: Certificate parses as valid X.509
  ansible.builtin.assert:
    that: not (item.failed | default(true))
    fail_msg: "{{ item.item.crt }} does not parse as an X.509 certificate."
    quiet: true
  loop: "{{ tc_s_crt.results }}"
  loop_control: {label: "{{ item.item.name }}"}

# The third link, and the end-to-end binding. Proves this certificate was issued
# from this CSR — not a stale one, and not another host's.
- name: Certificate public key matches the CSR it was signed from
  ansible.builtin.assert:
    that: item.0.public_key_fingerprints.sha256 == item.1.public_key_fingerprints.sha256
    fail_msg: >-
      {{ item.0.item.crt }} was not issued from {{ item.0.item.csr }} — the
      public keys differ. A different CSR was signed.
    quiet: true
  loop: "{{ tc_s_crt.results | zip(tc_s_csr.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}"}
  when:
    - not (item.0.failed | default(true))
    - not (item.1.failed | default(true))

- name: Certificate public key matches the private key
  ansible.builtin.assert:
    that: item.0.public_key_fingerprints.sha256 == item.1.public_key_fingerprints.sha256
    fail_msg: >-
      {{ item.0.item.crt }} does not match {{ item.0.item.key }}. The host would
      hold a certificate it has no private key for.
    quiet: true
  loop: "{{ tc_s_crt.results | zip(tc_c_key.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}"}
  when:
    - not (item.0.failed | default(true))
    - not (item.1.failed | default(true))

- name: Certificate CN matches the CSR CN
  ansible.builtin.assert:
    that: item.0.subject.commonName == item.1.subject.commonName
    fail_msg: >-
      {{ item.0.item.crt }} CN is '{{ item.0.subject.commonName }}' but the CSR
      asked for '{{ item.1.subject.commonName }}'.
    quiet: true
  loop: "{{ tc_s_crt.results | zip(tc_s_csr.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}"}
  when:
    - not (item.0.failed | default(true))
    - not (item.1.failed | default(true))

- name: Certificate SANs match the CSR SANs
  ansible.builtin.assert:
    that:
      - ((item.1.subject_alt_name | default([]))
         | difference(item.0.subject_alt_name | default([]))) | length == 0
    fail_msg: >-
      {{ item.0.item.crt }} is missing SANs the CSR requested:
      {{ (item.1.subject_alt_name | default([]))
         | difference(item.0.subject_alt_name | default([])) | join(', ') }}.
      The IPA profile may be stripping them.
    quiet: true
  loop: "{{ tc_s_crt.results | zip(tc_s_csr.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}"}
  when:
    - not (item.0.failed | default(true))
    - not (item.1.failed | default(true))

- name: Certificate issuer is the IPA CA
  ansible.builtin.assert:
    that: item.issuer.commonName == tc_ipa_ca_cn
    fail_msg: >-
      {{ item.item.crt }} issuer CN is '{{ item.issuer.commonName }}', expected
      '{{ tc_ipa_ca_cn }}'.
    quiet: true
  loop: "{{ tc_s_crt.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Certificate is inside its validity window
  ansible.builtin.assert:
    that: not item.expired
    fail_msg: >-
      {{ item.item.crt }} is outside its validity window (notBefore
      {{ item.not_before }}, notAfter {{ item.not_after }}).
    quiet: true
  loop: "{{ tc_s_crt.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Certificate notBefore is not in the future beyond allowed skew
  ansible.builtin.assert:
    that:
      - (((item.not_before | to_datetime(tc_time_format)) - now(utc=true)).total_seconds() | float)
        <= (tc_max_clock_skew_seconds | int)
    fail_msg: >-
      {{ item.item.crt }} notBefore is {{ item.not_before }}, in the future
      beyond the allowed skew. Check NTP on {{ tc_ipa_host }}.
    quiet: true
  loop: "{{ tc_s_crt.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Certificate signature algorithm is approved
  ansible.builtin.assert:
    that: item.signature_algorithm in tc_allowed_sig_algs
    fail_msg: >-
      {{ item.item.crt }} is signed with '{{ item.signature_algorithm }}', which
      is not on the approved list. Check the IPA certificate profile.
    quiet: true
  loop: "{{ tc_s_crt.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Certificate key size meets policy
  ansible.builtin.assert:
    that:
      - (item.public_key_type | lower) != 'rsa'
        or (item.public_key_data.size | int) >= (tc_min_key_bits | int)
    fail_msg: >-
      {{ item.item.crt }} carries a {{ item.public_key_data.size }}-bit key;
      minimum is {{ tc_min_key_bits }}.
    quiet: true
  loop: "{{ tc_s_crt.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}

- name: Certificate carries the expected extended key usage
  ansible.builtin.assert:
    that:
      - (item.item.eku == 'serverAuth' and
         (('TLS Web Server Authentication' in (item.extended_key_usage | default([])))
          or ('serverAuth' in (item.extended_key_usage | default([])))))
        or
        (item.item.eku == 'clientAuth' and
         (('TLS Web Client Authentication' in (item.extended_key_usage | default([])))
          or ('clientAuth' in (item.extended_key_usage | default([])))))
    fail_msg: >-
      {{ item.item.crt }} does not carry {{ item.item.eku }}. Present:
      {{ (item.extended_key_usage | default([])) | join(', ') or 'none' }}.
      Check the IPA certificate profile.
    quiet: true
  loop: "{{ tc_s_crt.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}
  when: item.item.eku | length > 0

- name: Certificate validity period matches the IPA profile
  ansible.builtin.assert:
    that:
      - ((((item.not_after | to_datetime(tc_time_format))
           - (item.not_before | to_datetime(tc_time_format))).days
          - (tc_expected_validity_days | int)) | abs)
        <= (tc_validity_tolerance_days | int)
    fail_msg: >-
      {{ item.item.crt }} is valid for
      {{ ((item.not_after | to_datetime(tc_time_format))
          - (item.not_before | to_datetime(tc_time_format))).days }} days,
      expected {{ tc_expected_validity_days }}
      (+/- {{ tc_validity_tolerance_days }}). The profile may have changed.
    quiet: true
  loop: "{{ tc_s_crt.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }}"}
  when: (tc_expected_validity_days | int) > 0

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 (continued) — what IPA itself says
# ─────────────────────────────────────────────────────────────────────────────

- name: Authenticate to IPA on the IT server
  ansible.builtin.command:
    argv: [kinit, -k, -t, "{{ tc_krb5_keytab }}"]
  environment: {KRB5CCNAME: "{{ tc_krb5_ccache }}"}
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  changed_when: false
  failed_when: false
  register: tc_kinit
  when: tc_query_ipa | bool

- name: Ask IPA about each issued serial
  ansible.builtin.command:
    argv: [ipa, cert-show, "{{ item.serial_number }}"]
  environment: {KRB5CCNAME: "{{ tc_krb5_ccache }}"}
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  changed_when: false
  failed_when: false
  throttle: "{{ tc_ipa_throttle | int }}"
  loop: "{{ tc_s_crt.results | rejectattr('failed', 'defined') | list }}"
  loop_control: {label: "{{ item.item.name }} serial={{ item.serial_number }}"}
  register: tc_ipa_show
  when:
    - tc_query_ipa | bool
    - (tc_kinit.rc | default(1)) == 0

- name: Ask IPA for the host entry
  ansible.builtin.command:
    argv: [ipa, host-show, "{{ ansible_facts['fqdn'] }}"]
  environment: {KRB5CCNAME: "{{ tc_krb5_ccache }}"}
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  changed_when: false
  failed_when: false
  throttle: "{{ tc_ipa_throttle | int }}"
  register: tc_ipa_host_show
  when:
    - tc_query_ipa | bool
    - (tc_kinit.rc | default(1)) == 0
    - not (tc_is_itserver | bool)

- name: IPA has a record of the issued serial
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      IPA has no record of serial {{ item.item.serial_number }}
      ({{ item.item.item.crt }}). The certificate was not issued by this CA, or
      was issued outside IPA.
    quiet: true
  loop: "{{ tc_ipa_show.results | default([]) }}"
  loop_control: {label: "{{ item.item.item.name | default('skipped') }}"}
  when: item.item is defined

- name: An IPA host entry exists for this host
  ansible.builtin.assert:
    that: tc_ipa_host_show.rc == 0
    fail_msg: >-
      IPA has no host entry for {{ ansible_facts['fqdn'] }}. Certificates cannot
      be issued or renewed against a principal that does not exist.
    quiet: true
  when:
    - tc_query_ipa | bool
    - not (tc_is_itserver | bool)
    - tc_ipa_host_show.rc is defined

# ─────────────────────────────────────────────────────────────────────────────
# Fleet-wide consistency — runs once, not per host
# ─────────────────────────────────────────────────────────────────────────────

- name: List per-host directories on the controller
  ansible.builtin.find:
    paths: "{{ tc_cert_root }}"
    file_type: directory
    recurse: false
  delegate_to: localhost
  become: false
  run_once: true
  register: tc_all_dirs
  failed_when: false

- name: No per-host directory exists for a host absent from the inventory
  ansible.builtin.assert:
    that: _orphans | length == 0
    fail_msg: >-
      Directories in {{ tc_cert_root }} with no matching inventory host:
      {{ _orphans | join(', ') }}. These are decommissioned hosts whose private
      keys are still on disk.
    quiet: true
  vars:
    _orphans: >-
      {{ (tc_all_dirs.files | default([]) | map(attribute='path') | map('basename') | list)
         | difference(ansible_play_hosts_all
                      | map('extract', hostvars, 'inventory_hostname_short') | list) }}
  run_once: true
  when: tc_all_dirs.files is defined

- name: Global certificates are not present in any per-host directory
  ansible.builtin.find:
    paths: "{{ tc_host_dir }}"
    patterns: "{{ tc_global_units | map(attribute='name') | map('regex_replace', '$', '.*') | list }}"
    file_type: file
  delegate_to: localhost
  become: false
  register: tc_global_leak
  failed_when: false
  when: not (tc_is_itserver | bool)

- name: No global certificate has leaked into a per-host directory
  ansible.builtin.assert:
    that: (tc_global_leak.files | default([])) | length == 0
    fail_msg: >-
      Global certificate files found in {{ tc_host_dir }}:
      {{ (tc_global_leak.files | default([]) | map(attribute='path') | map('basename') | list) | join(', ') }}.
      These belong at {{ tc_cert_root }} and are not distributed per host.
    quiet: true
  when:
    - not (tc_is_itserver | bool)
    - tc_global_leak.files is defined