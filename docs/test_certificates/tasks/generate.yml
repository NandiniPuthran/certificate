---
# Asserts that the current certificate set is correct.
#
# Every check here is about state as it stands now — which is what generation
# produced, and equally what the last renewal produced. Nothing here needs a
# previous certificate or the renewal machinery; that is renew.yml's job, and
# no assertion appears in both files.
#
# The chain under test:   key  ->  CSR  ->  certificate
#
# Each link is checked, because "a certificate exists and looks valid" stays
# true even when a stale CSR was signed, or another host's was.

# ─────────────────────────────────────────────────────────────────────────────
# Inventory consistency
#
# Runs first: CN and SAN come from different inventory variables and nothing
# keeps them in step. If they have drifted, every identity failure below is a
# symptom of this one cause.
# ─────────────────────────────────────────────────────────────────────────────

- name: Expected CN appears in the expected SAN list
  ansible.builtin.assert:
    that: ('DNS:' ~ tc_expected_cn) in tc_expected_san
    fail_msg: >-
      CN {{ tc_expected_cn }} is not in ssl_san_dns
      [{{ tc_expected_san | join(', ') }}]. These come from different inventory
      variables and have drifted. Modern TLS clients match on SAN and ignore CN,
      so a certificate built this way would be rejected.
    quiet: true

# ─────────────────────────────────────────────────────────────────────────────
# The certificate directory
# ─────────────────────────────────────────────────────────────────────────────

- name: Certificate directory exists
  ansible.builtin.assert:
    that: tc_dir.stat.exists and tc_dir.stat.isdir
    fail_msg: >-
      {{ tc_host_dir }} does not exist on {{ tc_ipa_host }}. Nothing was
      generated or copied for {{ inventory_hostname }}.
    quiet: true

- name: Certificate directory is not world-traversable
  ansible.builtin.assert:
    that: (tc_dir.stat.mode | int(base=8)) % 8 == 0
    fail_msg: >-
      {{ tc_host_dir }} is mode {{ tc_dir.stat.mode }}. This tree holds private
      keys and must not be traversable by other users.
    quiet: true
  when: tc_dir.stat.exists

# ─────────────────────────────────────────────────────────────────────────────
# Private keys
# ─────────────────────────────────────────────────────────────────────────────

- name: Private key exists
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item.key }} is missing."
    quiet: true
  loop: "{{ tc_key_stat.results }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Private key is not readable by other users
  ansible.builtin.assert:
    that: (item.stat.mode | int(base=8)) % 64 == 0
    fail_msg: >-
      {{ item.item.key }} is mode {{ item.stat.mode }} — readable beyond its
      owner.
    quiet: true
  loop: "{{ tc_key_stat.results | selectattr('stat.exists') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Private key parses
  ansible.builtin.assert:
    that: not (item.failed | bool)
    fail_msg: "{{ item.item.key }} does not parse as a private key."
    quiet: true
  loop: "{{ tc_key.results }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Private key type and size meet policy
  ansible.builtin.assert:
    that:
      - (item.type | lower) != 'rsa'
        or (item.public_data.size | int) >= (tc_min_key_bits | int)
    fail_msg: >-
      {{ item.item.key }} is a {{ item.public_data.size }}-bit {{ item.type }}
      key; minimum is {{ tc_min_key_bits }}.
    quiet: true
  loop: "{{ tc_key.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

# ─────────────────────────────────────────────────────────────────────────────
# CSRs
# ─────────────────────────────────────────────────────────────────────────────

- name: CSR exists and parses
  ansible.builtin.assert:
    that: not (item.failed | bool)
    fail_msg: "{{ item.item.csr }} is missing or does not parse as a CSR."
    quiet: true
  loop: "{{ tc_csr.results }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: CSR signature is self-consistent
  ansible.builtin.assert:
    that: item.signature_valid
    fail_msg: >-
      {{ item.item.csr }} has an invalid self-signature. It was not produced by
      the key that claims to have signed it.
    quiet: true
  loop: "{{ tc_csr.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

# First link. A stale CSR beside a newer key means the certificate is issued for
# a public key the host does not hold the private half of.
- name: CSR public key matches the private key beside it
  ansible.builtin.assert:
    that: item.0.public_key_fingerprints.sha256 == item.1.public_key_fingerprints.sha256
    fail_msg: >-
      {{ item.0.item.csr }} was not built from {{ item.0.item.key }} — the
      public keys differ. One of the two is stale.
    quiet: true
  loop: "{{ tc_csr.results | zip(tc_key.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}" }
  when:
    - not (item.0.failed | bool)
    - not (item.1.failed | bool)

- name: CSR CN matches the expected identity
  ansible.builtin.assert:
    that: (item.subject.commonName | lower) == item.item.cn
    fail_msg: >-
      {{ item.item.csr }} CN is '{{ item.subject.commonName }}', expected
      '{{ item.item.cn }}'.
    quiet: true
  loop: "{{ tc_csr.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: CSR SANs include every expected name
  ansible.builtin.assert:
    that:
      - (item.item.san | difference(item.subject_alt_name | default([]) | map('lower') | list))
        | length == 0
    fail_msg: >-
      {{ item.item.csr }} is missing SANs
      {{ item.item.san | difference(item.subject_alt_name | default([]) | map('lower') | list)
         | join(', ') }}.
      Present: {{ (item.subject_alt_name | default([])) | join(', ') }}.
    quiet: true
  loop: "{{ tc_csr.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

# ─────────────────────────────────────────────────────────────────────────────
# Signed certificates
# ─────────────────────────────────────────────────────────────────────────────

- name: Certificate exists
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item.crt }} is missing. The CSR is present but was never signed.
    quiet: true
  loop: "{{ tc_crt_stat.results }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Certificate parses as valid X.509
  ansible.builtin.assert:
    that: not (item.failed | bool)
    fail_msg: "{{ item.item.crt }} does not parse as an X.509 certificate."
    quiet: true
  loop: "{{ tc_crt.results }}"
  loop_control: {label: "{{ item.item.name }}" }

# Second link, and the end-to-end binding: proves this certificate was issued
# from this CSR, not a stale one and not another host's.
- name: Certificate public key matches the CSR it was signed from
  ansible.builtin.assert:
    that: item.0.public_key_fingerprints.sha256 == item.1.public_key_fingerprints.sha256
    fail_msg: >-
      {{ item.0.item.crt }} was not issued from {{ item.0.item.csr }} — the
      public keys differ. A different CSR was signed.
    quiet: true
  loop: "{{ tc_crt.results | zip(tc_csr.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}" }
  when:
    - not (item.0.failed | bool)
    - not (item.1.failed | bool)

- name: Certificate public key matches the private key
  ansible.builtin.assert:
    that: item.0.public_key_fingerprints.sha256 == item.1.public_key_fingerprints.sha256
    fail_msg: >-
      {{ item.0.item.crt }} does not match {{ item.0.item.key }}. The host holds
      a certificate it has no private key for.
    quiet: true
  loop: "{{ tc_crt.results | zip(tc_key.results) | list }}"
  loop_control: {label: "{{ item.0.item.name }}" }
  when:
    - not (item.0.failed | bool)
    - not (item.1.failed | bool)

- name: Certificate CN matches the expected identity
  ansible.builtin.assert:
    that: (item.subject.commonName | lower) == item.item.cn
    fail_msg: >-
      {{ item.item.crt }} CN is '{{ item.subject.commonName }}', expected
      '{{ item.item.cn }}'.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Certificate SANs include every expected name
  ansible.builtin.assert:
    that:
      - (item.item.san | difference(item.subject_alt_name | default([]) | map('lower') | list))
        | length == 0
    fail_msg: >-
      {{ item.item.crt }} is missing SANs
      {{ item.item.san | difference(item.subject_alt_name | default([]) | map('lower') | list)
         | join(', ') }}.
      Present: {{ (item.subject_alt_name | default([])) | join(', ') }}.
      The IPA profile may be stripping them.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

# A name check, not a cryptographic one — any CA can call itself
# "CN=Certificate Authority". Full chain verification against a pinned anchor is
# deliberately out of scope here; what does hold this together is that IPA
# confirms it issued the serial, below.
- name: Certificate issuer is the IPA CA
  ansible.builtin.assert:
    that: item.issuer.commonName == tc_ipa_ca_cn
    fail_msg: >-
      {{ item.item.crt }} issuer CN is '{{ item.issuer.commonName }}', expected
      '{{ tc_ipa_ca_cn }}'.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Certificate is inside its validity window
  ansible.builtin.assert:
    that: not item.expired
    fail_msg: >-
      {{ item.item.crt }} is outside its validity window (notBefore
      {{ item.not_before }}, notAfter {{ item.not_after }}).
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Certificate notBefore is not in the future beyond allowed skew
  ansible.builtin.assert:
    that:
      - (((item.not_before | to_datetime(tc_time_format)) - now(utc=true)).total_seconds() | float)
        <= (tc_max_clock_skew_seconds | int)
    fail_msg: >-
      {{ item.item.crt }} notBefore is {{ item.not_before }}, in the future
      beyond the allowed skew. Check NTP on {{ tc_ipa_host }}.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Certificate signature algorithm is approved
  ansible.builtin.assert:
    that: item.signature_algorithm in tc_allowed_sig_algs
    fail_msg: >-
      {{ item.item.crt }} is signed with '{{ item.signature_algorithm }}', which
      is not on the approved list. Check the IPA certificate profile.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Certificate key size meets policy
  ansible.builtin.assert:
    that:
      - (item.public_key_type | lower) != 'rsa'
        or (item.public_key_data.size | int) >= (tc_min_key_bits | int)
    fail_msg: >-
      {{ item.item.crt }} carries a {{ item.public_key_data.size }}-bit key;
      minimum is {{ tc_min_key_bits }}.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }

- name: Certificate carries the expected extended key usages
  ansible.builtin.assert:
    that:
      - (tc_required_eku | difference(item.extended_key_usage | default([]))) | length == 0
    fail_msg: >-
      {{ item.item.crt }} is missing EKUs
      {{ tc_required_eku | difference(item.extended_key_usage | default([])) | join(', ') }}.
      Present: {{ (item.extended_key_usage | default([])) | join(', ') or 'none' }}.
      The IPA certificate profile may have changed.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }
  when: tc_check_eku | bool

- name: Certificate validity period matches the IPA profile
  ansible.builtin.assert:
    that:
      - ((((item.not_after | to_datetime(tc_time_format))
           - (item.not_before | to_datetime(tc_time_format))).days
          - (tc_expected_validity_days | int)) | abs)
        <= (tc_validity_tolerance_days | int)
    fail_msg: >-
      {{ item.item.crt }} is valid for
      {{ ((item.not_after | to_datetime(tc_time_format))
          - (item.not_before | to_datetime(tc_time_format))).days }} days,
      expected {{ tc_expected_validity_days }}
      (+/- {{ tc_validity_tolerance_days }}). The profile may have changed.
    quiet: true
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }
  when: (tc_expected_validity_days | int) > 0

# ─────────────────────────────────────────────────────────────────────────────
# What IPA says
# ─────────────────────────────────────────────────────────────────────────────

- name: IPA has a record of the issued serial
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: >-
      IPA has no record of serial {{ item.item.serial_number }}
      ({{ item.item.item.crt }}). The certificate was issued outside IPA, or by
      a different CA.
    quiet: true
  loop: "{{ tc_ipa_show.results | default([]) }}"
  loop_control: {label: "{{ item.item.item.name | default('skipped') }}" }
  when: item.item is defined

- name: An IPA host entry exists for this host
  ansible.builtin.assert:
    that: tc_ipa_host_show.rc == 0
    fail_msg: >-
      IPA has no host entry for {{ tc_expected_cn }}. Certificates cannot be
      issued or renewed against a principal that does not exist.
    quiet: true
  when: tc_ipa_host_show.rc is defined

# ─────────────────────────────────────────────────────────────────────────────
# Fleet-wide consistency — runs once
# ─────────────────────────────────────────────────────────────────────────────

- name: No unexpected directory exists under the certificate root
  ansible.builtin.assert:
    that: _orphans | length == 0
    fail_msg: >-
      Directories in {{ tc_cert_root }} that match no inventory host, no shared
      group, and are not in tc_ignore_dirs: {{ _orphans | join(', ') }}.
      Either a decommissioned host still has private keys on disk, or this is a
      directory that should be declared or ignored.
    quiet: true
  vars:
    # Compared against the whole inventory rather than the play, so --limit does
    # not flag every other host's directory. Both sides uppercased so the
    # comparison holds whatever case the directories were created with.
    _orphans: >-
      {{ (tc_all_dirs.files | default([]) | map(attribute='path')
          | map('basename') | map('upper') | list)
         | difference(tc_all_dir_names | default([]) | map('upper') | list)
         | difference(tc_ignore_dirs | map('upper') | list)
         | difference([tc_shared_dir | upper]) }}
  run_once: true
  when: tc_all_dirs.files is defined
