---
# Reads every piece of state the assertion files need, once.
#
# Runs with tags: always, so without scoping a --tags renew run would still pay
# for the IPA queries and a --tags generate run would still shell out to
# certmonger. Each block below is gated to the area that consumes it.
#
# No assertions here. Anything that can legitimately be absent is registered
# with failed_when: false and judged in generate.yml or renew.yml, so a missing
# file produces a named test failure rather than an unhandled error.

- name: Determine which areas are in scope for this run
  ansible.builtin.set_fact:
    tc_want_generate: "{{ ('all' in ansible_run_tags) or ('generate' in ansible_run_tags) }}"
    tc_want_renew: "{{ ('all' in ansible_run_tags) or ('renew' in ansible_run_tags) }}"

# ─────────────────────────────────────────────────────────────────────────────
# Resolve units into concrete paths
#
# Three scopes resolve here:
#   shared — fixed directory and CN (the group certificates)
#   global — root directory, IT server identity
#   host   — the host's own directory and identity
#
# `name` is the display label, prefixed for shared units so DSM/server does not
# read as this host's server. `base` stays the raw unit name, since that is what
# the files on disk are called.
# ─────────────────────────────────────────────────────────────────────────────

- name: Build the file paths and expected identity for each certificate
  ansible.builtin.set_fact:
    tc_files: >-
      {{ tc_files | default([]) + [{
           'name': (item.shared_dir ~ '/' ~ item.name)
                   if (item.shared_dir is defined) else item.name,
           'base': item.name,
           'dir': _dir,
           'key': _dir ~ '/' ~ item.name ~ '.key',
           'csr': _dir ~ '/' ~ item.name ~ '.csr',
           'crt': _dir ~ '/' ~ item.name ~ '.crt',
           'serial': _dir ~ '/' ~ item.name ~ tc_serial_suffix,
           'cn':  item.shared_cn if (item.shared_cn is defined)
                  else (tc_ipa_fqdn if (item.global | default(false)) else tc_expected_cn),
           'san': ['DNS:' ~ item.shared_cn] if (item.shared_cn is defined)
                  else (tc_ipa_san if (item.global | default(false)) else tc_expected_san)
         }] }}
  vars:
    _dir: >-
      {{ (tc_cert_root ~ '/' ~ item.shared_dir) if (item.shared_dir is defined)
         else (tc_cert_root if (item.global | default(false)) else tc_host_dir) }}
  loop: "{{ tc_units }}"
  loop_control: {label: "{{ item.name }}" }

# ─────────────────────────────────────────────────────────────────────────────
# On-disk state — needed by both areas
# ─────────────────────────────────────────────────────────────────────────────

- name: Stat the certificate directory
  ansible.builtin.stat:
    path: "{{ tc_host_dir }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  register: tc_dir

- name: Stat private keys
  ansible.builtin.stat:
    path: "{{ item.key }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  register: tc_key_stat

- name: Stat certificates
  ansible.builtin.stat:
    path: "{{ item.crt }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  register: tc_crt_stat

# These three use failed_when: false so a missing or corrupt file is reported as
# a named test failure rather than aborting the run. NOTE that this sets
# failed: false on every result, so downstream filtering must be
# rejectattr('failed') — rejectattr('failed', 'defined') would match every entry
# and silently skip the whole loop.
- name: Read private keys
  community.crypto.openssl_privatekey_info:
    path: "{{ item.key }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  register: tc_key
  failed_when: false

- name: Read CSRs
  community.crypto.openssl_csr_info:
    path: "{{ item.csr }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  register: tc_csr
  failed_when: false

- name: Read certificates
  community.crypto.x509_certificate_info:
    path: "{{ item.crt }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  register: tc_crt
  failed_when: false

# ─────────────────────────────────────────────────────────────────────────────
# What IPA says — generate only
# ─────────────────────────────────────────────────────────────────────────────

- name: Authenticate to IPA on the IT server
  ansible.builtin.command:
    argv: [kinit, -k, -t, "{{ tc_krb5_keytab }}"]
  environment: {KRB5CCNAME: "{{ tc_krb5_ccache }}" }
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  changed_when: false
  failed_when: false
  register: tc_kinit
  when:
    - tc_query_ipa | bool
    - tc_want_generate | bool

- name: Record whether IPA queries are usable
  ansible.builtin.set_fact:
    tc_online: >-
      {{ (tc_query_ipa | bool) and (tc_want_generate | bool)
         and ((tc_kinit.rc | default(1)) == 0) }}

- name: Ask IPA about each issued serial
  ansible.builtin.command:
    argv: [ipa, cert-show, "{{ item.serial_number }}"]
  environment: {KRB5CCNAME: "{{ tc_krb5_ccache }}" }
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  changed_when: false
  failed_when: false
  throttle: "{{ tc_ipa_throttle | int }}"
  loop: "{{ tc_crt.results | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }} serial={{ item.serial_number }}" }
  register: tc_ipa_show
  when: tc_online | bool

- name: Ask IPA for the host entry
  ansible.builtin.command:
    argv: [ipa, host-show, "{{ tc_expected_cn }}"]
  environment: {KRB5CCNAME: "{{ tc_krb5_ccache }}" }
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  changed_when: false
  failed_when: false
  throttle: "{{ tc_ipa_throttle | int }}"
  register: tc_ipa_host_show
  when: tc_online | bool

- name: List directories under the certificate root
  ansible.builtin.find:
    paths: "{{ tc_cert_root }}"
    file_type: directory
    recurse: false
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  run_once: true
  register: tc_all_dirs
  failed_when: false
  when: tc_want_generate | bool

# Built in a loop rather than one expression, because each host needs its own
# `hostname` lookup with a fallback.
- name: Build the expected directory name for every inventory host
  ansible.builtin.set_fact:
    tc_all_dir_names: >-
      {{ tc_all_dir_names | default([])
         + [ hostvars[item][tc_dir_name_var] | default(item | upper) ] }}
  loop: "{{ groups['all'] }}"
  loop_control: {label: "{{ item }}" }
  run_once: true
  when: tc_want_generate | bool

# ─────────────────────────────────────────────────────────────────────────────
# Renewal evidence — renew only
# ─────────────────────────────────────────────────────────────────────────────

- name: Read the serial files
  ansible.builtin.slurp:
    src: "{{ item.serial }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  register: tc_serial
  failed_when: false
  when: tc_want_renew | bool

- name: Find renewal backups
  ansible.builtin.find:
    paths: "{{ item.dir }}"
    patterns: "{{ item.base }}{{ tc_backup_glob }}"
    file_type: file
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  register: tc_backups
  failed_when: false
  when: tc_want_renew | bool

# Chosen by mtime rather than by parsing the timestamp out of the filename, so
# the naming format can change without breaking these tests.
- name: Select the most recent backup for each certificate
  ansible.builtin.set_fact:
    tc_prev_paths: >-
      {{ tc_prev_paths | default([]) + [{
           'name': item.item.name,
           'path': ((item.files | sort(attribute='mtime') | last).path
                    if ((item.files | default([]) | length) > 0) else '')
         }] }}
  loop: "{{ tc_backups.results | default([]) }}"
  loop_control: {label: "{{ item.item.name | default('skipped') }}" }
  when:
    - tc_want_renew | bool
    - item.item is defined

- name: Read the most recent backup certificate
  community.crypto.x509_certificate_info:
    path: "{{ item.path }}"
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  loop: "{{ tc_prev_paths | default([]) | selectattr('path') | list }}"
  loop_control: {label: "{{ item.name }}" }
  register: tc_prev
  failed_when: false
  when: tc_want_renew | bool

# Indexed by name rather than zipped, because a host that has never renewed has
# no backup and the two lists would not line up.
- name: Index the previous certificates by unit name
  ansible.builtin.set_fact:
    tc_prev_by_name: >-
      {{ tc_prev_by_name | default({}) | combine({ item.item.name: item }) }}
  loop: "{{ tc_prev.results | default([]) | rejectattr('failed') | list }}"
  loop_control: {label: "{{ item.item.name }}" }
  when: tc_want_renew | bool

- name: Read certmonger tracking
  ansible.builtin.command:
    argv: [getcert, list]
  delegate_to: "{{ tc_ipa_host }}"
  become: true
  changed_when: false
  failed_when: false
  register: tc_getcert
  when: tc_want_renew | bool

# Matched on the certificate path, not the hostname, so a host with several
# tracked certificates gets each one's own block rather than the first.
- name: Find the certmonger request covering each certificate
  ansible.builtin.set_fact:
    tc_cm: >-
      {{ tc_cm | default({}) | combine({
           item.name: ((tc_getcert.stdout | default('')).split('Request ID ')
                       | select('search', item.crt | regex_escape)
                       | list | first | default('')) }) }}
  loop: "{{ tc_files }}"
  loop_control: {label: "{{ item.name }}" }
  when: tc_want_renew | bool
