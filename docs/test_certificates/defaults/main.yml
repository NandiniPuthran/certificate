---
# ── Topology ─────────────────────────────────────────────────────────────────
# The IT server is the IPA client that signs CSRs. The Ansible controller is
# the deployer where keys and CSRs are generated.
tc_ipa_host: "{{ groups['itserver'] | default([]) | first | default('') }}"
tc_ipa_realm: EXAMPLE.COM
tc_ipa_ca_cn: Certificate Authority

# ── Layout — identical on the controller and the IT server ───────────────────
#   /data/certificate/
#   ├── authenticity.{key,csr,crt}     <- global, at the root
#   ├── keycloak.{key,csr,crt}         <- global, at the root
#   └── <short-hostname>/
#       ├── server.{key,csr,crt}
#       ├── client.{key,csr,crt}
#       └── mok.{key,csr,crt}          (mok group only)
tc_cert_root: /data/certificate
tc_host_dir: "{{ tc_cert_root }}/{{ inventory_hostname_short }}"

# ── Which certificates exist ─────────────────────────────────────────────────
# Per-host. `eku` is asserted only when set.
tc_host_units:
  - name: server
    eku: serverAuth
  - name: client
    eku: clientAuth

# Added for hosts in tc_mok_group.
tc_mok_group: mok
tc_mok_units:
  - name: mok

# Global, generated once, CN and SAN carry the IT server FQDN.
tc_global_units:
  - name: authenticity
  - name: keycloak
    eku: serverAuth

# ── Expected identity ────────────────────────────────────────────────────────
tc_expected_cn: "{{ ansible_facts['fqdn'] }}"
tc_expected_san:
  - "DNS:{{ ansible_facts['fqdn'] }}"

# ── Policy ───────────────────────────────────────────────────────────────────
tc_min_key_bits: 2048
tc_max_clock_skew_seconds: 300
tc_allowed_sig_algs:
  - sha256WithRSAEncryption
  - sha384WithRSAEncryption
  - sha512WithRSAEncryption
  - ecdsa-with-SHA256
  - ecdsa-with-SHA384

# Expected issued validity in days; 0 disables that test.
tc_expected_validity_days: 0
tc_validity_tolerance_days: 2

# Private keys must not be readable by other users, on either machine.
tc_key_max_mode: '0600'
tc_dir_max_mode: '0700'

# ── Delegated IPA queries ────────────────────────────────────────────────────
tc_query_ipa: true
tc_krb5_keytab: /etc/krb5.keytab
tc_krb5_ccache: /run/test_certificates.ccache
tc_ipa_throttle: 8

# ASN.1 timestamp format from community.crypto. Override if yours differs.
tc_time_format: '%Y%m%d%H%M%SZ'