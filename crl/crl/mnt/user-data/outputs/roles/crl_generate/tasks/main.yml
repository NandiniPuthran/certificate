---
- name: Validate inputs
  ansible.builtin.import_tasks: assert.yml
  tags: [crl_generate, crl_generate_assert]

- name: Decide whether the CRL needs generating
  ansible.builtin.import_tasks: inspect.yml
  tags: [crl_generate, crl_generate_inspect]

- name: Generate the CRL
  ansible.builtin.import_tasks: generate.yml
  tags: [crl_generate, crl_generate_generate]

- name: Verify the generated CRL
  ansible.builtin.import_tasks: verify.yml
  tags: [crl_generate, crl_generate_verify]

- name: Distribute to managed hosts
  ansible.builtin.import_tasks: distribute.yml
  tags: [crl_generate, crl_generate_distribute]
