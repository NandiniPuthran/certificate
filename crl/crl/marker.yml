---
- name: Record that these files came from the local CA
  ansible.builtin.copy:
    content: |
      These PKI files were generated by the crl_generate role from CA
      "{{ crl_generate_name }}" held on the Ansible control node.
      Paths still holding that content:
      {% for path in _crlg_still_ours | sort %}
        - {{ path }}
      {% endfor %}
      {% if crl_generate_placeholder_only %}
      They are placed only when missing. This file disappears once another
      role replaces them with live data.
      {% endif %}
    dest: "{{ crl_generate_marker }}"
    owner: "{{ crl_generate_owner }}"
    group: "{{ crl_generate_group }}"
    mode: "{{ crl_generate_file_mode }}"
  when: _crlg_still_ours | length > 0

- name: Remove the marker once nothing is ours any more
  ansible.builtin.file:
    path: "{{ crl_generate_marker }}"
    state: absent
  when: _crlg_still_ours | length == 0
