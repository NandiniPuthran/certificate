---
# test-ness-pipeline.yml
#
# Final test playbook for NESS log pipeline.
# 
# What it does:
#   1. Injects 15 test logs into a Fluent Bit-tailed file
#   2. Waits for them to reach NESS syslog
#   3. Validates RFC 5424 format, SD fields, UUID, and classification rules
#   4. Reports pass/fail for each test case
#
# Test cases:
#   TC-1  RFC 5424 format and valid timestamp
#   TC-2  All structured data fields present and non-empty
#   TC-3  eventId is a valid UUID
#   TC-5  SECURITY and BAPP classification rules working
#   TC-6  Unmatched logs dropped as intended
#
# Run:  ansible-playbook -i inventory.ini test-ness-pipeline.yml
#
# NOTE: This tests log format and classification only. Does NOT test
# mirroring/redundancy (Fluentd1 is the only instance writing to NESS).

- name: NESS pipeline test
  hosts: ness
  become: true
  gather_facts: false

  vars:
    syslog_path: /var/log/syslog
    lines_to_read: 100

    fluentbit_host: "{{ groups['fluentd'] | first }}"
    test_file: /var/log/ness-pipeline-test.log
    test_host: ness-test-01

    wait_retries: 24
    exclude_hostnames:
      - ness01

    sd_fields:
      - eventId
      - notificationType
      - eventLevel
      - eventName
      - nessLogType
      - hostname
      - siteType
      - siteInstance

    # One test line per classification rule
    test_logs:
      - name: fw-vendor
        tc: TC-5
        expect: SECURITY
        app: fw
        msg: 'id=firewall logtype="filter" action=drop src=10.99.0.5 dst=10.99.0.1 dstport=22'

      - name: fw-generic
        tc: TC-5
        expect: SECURITY
        app: kernel
        msg: 'DROP IN=eth0 OUT= SRC=10.99.0.5 DST=10.99.0.1 PROTO=TCP DPT=22'

      - name: sec-cisco
        tc: TC-5
        expect: SECURITY
        app: ios
        msg: '%SEC_LOGIN-5-LOGIN_SUCCESS: Login Success [user: testuser] [Source: 10.99.0.5]'

      - name: sec-ssh
        tc: TC-5
        expect: SECURITY
        app: sshd
        msg: 'Accepted password for testuser from 10.99.0.5 port 22 ssh2'

      - name: sec-su
        tc: TC-5
        expect: SECURITY
        app: su
        msg: 'pam_unix(su:session): session opened for user root(uid=0) by testuser(uid=1001)'

      - name: noise
        tc: TC-5
        expect: DROP
        app: healthcheck
        msg: 'routine heartbeat ok interval=60'

      - name: bp-event
        tc: TC-6
        expect: BAPP
        app: bapp_payments
        msg: 'traceType=EVENT payment authorised amount=100'

      - name: bp-log
        tc: TC-6
        expect: DROP
        app: bapp_payments
        msg: 'traceType=INFO cache warmed entries=512'

      - name: bp-mixed
        tc: TC-6
        expect: BAPP
        app: bapp_payments
        msg: 'traceType=EVENT Failed password for operator from 10.99.0.5'

    rfc5424_regex: '^<(?:0|[1-9][0-9]{0,2})>[1-9][0-9]?[ ](?:-|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?(?:Z|(?!-00:00)[+-](?:0[0-9]|1[0-4]):[0-5][0-9]))[ ](?:-|[!-~]{1,255})[ ](?:-|[!-~]{1,48})[ ](?:-|[!-~]{1,128})[ ](?:-|[!-~]{1,32})[ ](?:-|(?:\[[!-~]{1,32}(?:[ ][!-~]{1,32}="(?:[^"\\\]]|\\["\\\]])*")*\])+)(?:[ ][\s\S]*)?$'

    uuid_regex: 'eventId="[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"'

    expected_arrivals: "{{ (test_logs | rejectattr('expect', 'eq', 'DROP') | list | length) }}"

  tasks:

    - name: Generate unique run id and timestamp
      ansible.builtin.set_fact:
        run_id: "TEST{{ now(true, '%Y%m%d%H%M%S') }}"
        line_ts: "{{ now(true, '%Y-%m-%dT%H:%M:%S.%f') }}0+00:00"

    - name: Create test file
      ansible.builtin.file:
        path: "{{ test_file }}"
        state: touch
        owner: root
        group: adm
        mode: "0640"
      delegate_to: "{{ fluentbit_host }}"
      register: _test_file

    - name: Wait for Fluent Bit to notice new file (first run only)
      ansible.builtin.pause:
        seconds: 70
      when: _test_file is changed

    - name: Clear previous run's lines
      ansible.builtin.shell: "truncate -s 0 {{ test_file }} && sleep 5"
      delegate_to: "{{ fluentbit_host }}"
      changed_when: true
      when: _test_file is not changed

    - name: Write test lines to the file
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          {
          {% for t in test_logs %}
          printf '%s\n' {{ (line_ts ~ ' ' ~ test_host ~ ' ' ~ t.app ~ '[4242]: ' ~ t.msg ~ ' marker=' ~ run_id ~ ':' ~ t.name ~ ';') | quote }}
          {% endfor %}
          } >> {{ test_file }}
      delegate_to: "{{ fluentbit_host }}"
      no_log: true
      changed_when: true

    - name: Wait for logs to reach NESS
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          for i in $(seq 1 {{ wait_retries }}); do
            n=$(grep -c 'marker={{ run_id }}[:]' {{ syslog_path }} || true)
            [ "${n:-0}" -ge {{ expected_arrivals }} ] && break
            sleep 5
          done
          echo "${n:-0}"
      register: _arrived
      changed_when: false

    - name: Give dropped logs time to confirm they're gone
      ansible.builtin.pause:
        seconds: 10

    - name: Read test logs from syslog
      ansible.builtin.shell:
        cmd: "grep 'marker={{ run_id }}[:]' {{ syslog_path }} || true"
      register: _test
      changed_when: false

    - name: Read recent Fluentd lines from syslog
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          tail -n 5000 {{ syslog_path }} | grep '^<'
          | grep -v -E '[ ](ness01)[ ]'
          | tail -n {{ lines_to_read }} || true
      register: _recent
      changed_when: false

    - name: Combine all lines to check
      ansible.builtin.set_fact:
        test_lines: "{{ _test.stdout_lines }}"
        all_lines: "{{ (_recent.stdout_lines + _test.stdout_lines) | unique | list }}"

    # Test cases
    - name: TC-1 | RFC 5424 format and timestamp
      ansible.builtin.set_fact:
        tc1_bad: "{{ all_lines | reject('match', rfc5424_regex) | list }}"

    - name: TC-2 | All SD fields present and non-empty
      vars:
        _missing: "{{ all_lines | reject('search', item ~ '=\"[^\"]+\"') | list }}"
      ansible.builtin.set_fact:
        tc2_bad: "{{ (tc2_bad | default([]) + _missing) | unique | list }}"
        tc2_fields: "{{ tc2_fields | default([]) + ([item] if _missing | length > 0 else []) }}"
      loop: "{{ sd_fields }}"

    - name: TC-3 | eventId is a valid UUID
      ansible.builtin.set_fact:
        tc3_bad: "{{ all_lines | reject('search', uuid_regex) | list }}"

    - name: TC-5 | SECURITY classification
      vars:
        _lines: "{{ test_lines | select('search', run_id ~ ':' ~ item.name ~ ';') | list }}"
        _type: "{{ _lines | map('regex_findall', 'nessLogType=\"[^\"]*\"') | flatten | unique | join(', ') }}"
      ansible.builtin.set_fact:
        tc5_bad: >-
          {{ tc5_bad | default([])
             + ([item.name ~ ': should have been dropped, but arrived']
                if item.expect == 'DROP' and (_lines | length) > 0 else [])
             + ([item.name ~ ': did not arrive at all']
                if item.expect != 'DROP' and (_lines | length) == 0 else [])
             + ([item.name ~ ': expected nessLogType=' ~ item.expect ~ ', got ' ~ (_type or 'none')]
                if item.expect != 'DROP' and (_lines | length) > 0 and _type != 'nessLogType="' ~ item.expect ~ '"' else []) }}
      loop: "{{ test_logs | selectattr('tc', 'eq', 'TC-5') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: TC-6 | BAPP classification
      vars:
        _lines: "{{ test_lines | select('search', run_id ~ ':' ~ item.name ~ ';') | list }}"
        _type: "{{ _lines | map('regex_findall', 'nessLogType=\"[^\"]*\"') | flatten | unique | join(', ') }}"
      ansible.builtin.set_fact:
        tc6_bad: >-
          {{ tc6_bad | default([])
             + ([item.name ~ ': should have been dropped, but arrived']
                if item.expect == 'DROP' and (_lines | length) > 0 else [])
             + ([item.name ~ ': did not arrive at all']
                if item.expect != 'DROP' and (_lines | length) == 0 else [])
             + ([item.name ~ ': expected nessLogType=' ~ item.expect ~ ', got ' ~ (_type or 'none')]
                if item.expect != 'DROP' and (_lines | length) > 0 and _type != 'nessLogType="' ~ item.expect ~ '"' else []) }}
      loop: "{{ test_logs | selectattr('tc', 'eq', 'TC-6') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # Report
    - name: Test result
      ansible.builtin.debug:
        msg:
          - "Test lines arrived: {{ _arrived.stdout }} of {{ expected_arrivals }} expected"
          - "TC-1  RFC 5424 format and timestamp             {{ 'PASS' if tc1_bad | length == 0 else 'FAIL (' ~ tc1_bad | length ~ ')' }}"
          - "TC-2  All SD fields present and non-empty       {{ 'PASS' if tc2_bad | length == 0 else 'FAIL (' ~ tc2_bad | length ~ ')' }}"
          - "TC-3  eventId is a valid UUID                   {{ 'PASS' if tc3_bad | length == 0 else 'FAIL (' ~ tc3_bad | length ~ ')' }}"
          - "TC-5  SECURITY classification working           {{ 'PASS' if tc5_bad | length == 0 else 'FAIL (' ~ tc5_bad | length ~ ')' }}"
          - "TC-6  BAPP classification and drops working     {{ 'PASS' if tc6_bad | length == 0 else 'FAIL (' ~ tc6_bad | length ~ ')' }}"
          - "RESULT: {{ 'PASS' if (tc1_bad + tc2_bad + tc3_bad + tc5_bad + tc6_bad) | length == 0 else 'FAIL' }}"

    - name: Details of failures
      ansible.builtin.debug:
        msg: "{{ [item.title] + item.bad[:3] }}"
      loop:
        - title: "TC-1  RFC 5424 failures:"
          bad: "{{ tc1_bad }}"
        - title: "TC-2  SD field failures ({{ tc2_fields | unique | join(', ') }}):"
          bad: "{{ tc2_bad }}"
        - title: "TC-3  UUID failures:"
          bad: "{{ tc3_bad }}"
        - title: "TC-5  SECURITY classification failures:"
          bad: "{{ tc5_bad }}"
        - title: "TC-6  BAPP classification failures:"
          bad: "{{ tc6_bad }}"
      loop_control:
        label: "{{ item.title }}"
      when: item.bad | length > 0

    - name: Gate | All tests passed
      ansible.builtin.assert:
        that:
          - tc1_bad | length == 0
          - tc2_bad | length == 0
          - tc3_bad | length == 0
          - tc5_bad | length == 0
          - tc6_bad | length == 0
        fail_msg: "One or more tests failed - see details above"
        quiet: true