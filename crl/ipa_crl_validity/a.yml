# roles/freeradius/tasks/crl.yml
- name: Check the CRL is present in the CRL path
  ansible.builtin.stat:
    path: "{{ freeradius_crl_src }}"
  register: crl_src

- name: Fail here rather than at service start
  ansible.builtin.assert:
    that:
      - crl_src.stat.exists
      - crl_src.stat.size > 0
    fail_msg: >-
      {{ freeradius_crl_src }} is missing or empty. FreeRADIUS will reject
      every EAP-TLS handshake once check_crl is on. Run crl_fetch first.
    quiet: true

- name: Install the CRL into ca_path
  ansible.builtin.copy:
    src: "{{ freeradius_crl_src }}"
    dest: "{{ freeradius_ca_path }}/{{ freeradius_crl_name }}"
    remote_src: true
    owner: root
    group: "{{ freeradius_group }}"
    mode: "0640"
  register: crl_installed

- name: Read the CRL issuer hash
  ansible.builtin.command:
    cmd: >-
      openssl crl -hash -noout
      -in {{ freeradius_ca_path }}/{{ freeradius_crl_name }}
  register: crl_hash
  changed_when: false

- name: Check for the hash symlink
  ansible.builtin.stat:
    path: "{{ freeradius_ca_path }}/{{ crl_hash.stdout | trim }}.r0"
  register: crl_link

- name: Rehash the directory
  ansible.builtin.command:
    cmd: "{{ freeradius_rehash_cmd }} {{ freeradius_ca_path }}"
  when: crl_installed.changed or not crl_link.stat.exists
  register: crl_rehash
  changed_when: crl_rehash.rc == 0
  notify: restart freeradius

- name: Confirm the CRL is resolvable by hash
  ansible.builtin.stat:
    path: "{{ freeradius_ca_path }}/{{ crl_hash.stdout | trim }}.r0"
  register: crl_link_final
  failed_when: not crl_link_final.stat.exists


  docker exec <container> pki-server ca-config-set ca.crl.MasterCRL.enableDailyUpdates false
docker exec <container> pki-server ca-config-set ca.crl.MasterCRL.nextUpdateGracePeriod 525600
docker exec <container> pki-server ca-config-show ca.crl.MasterCRL.nextUpdateGracePeriod