---
- name: Read current values
  ansible.builtin.command:
    argv: "{{ ipa_crl_exec + ['pki-server', 'ca-config-show', item.key] }}"
  loop: "{{ ipa_crl_settings }}"
  loop_control:
    label: "{{ item.key }}"
  register: ipa_crl_current
  changed_when: false
  failed_when: false

# rc != 0 means the key is unset. ca-config-show prints "key=value", so take
# what follows the first '='.
- name: Build the drift list
  ansible.builtin.set_fact:
    ipa_crl_drift: "{{ (ipa_crl_drift | default([])) + [item.item] }}"
  loop: "{{ ipa_crl_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: >-
    item.rc != 0 or
    (item.stdout | trim | split('=') | last | trim)
      != (item.item.value | string)

- name: Report drift
  ansible.builtin.debug:
    msg: >-
      {{ ipa_crl_drift | default([]) | map(attribute='key') | list
         | ternary(ipa_crl_drift | default([]) | map(attribute='key') | list,
                   ['no change needed']) }}

- name: Apply CRL settings
  when: ipa_crl_drift | default([]) | length > 0
  block:
    # pki-tomcatd holds its config in memory and writes it back over CS.cfg on
    # shutdown. Editing while it runs looks like it worked and is reverted by
    # the very restart you do to apply it.
    - name: Stop the CA
      ansible.builtin.command:
        argv: "{{ ipa_crl_exec + ['systemctl', 'stop', ipa_crl_service] }}"
      changed_when: true

    - name: Write settings
      ansible.builtin.command:
        argv: >-
          {{ ipa_crl_exec + ['pki-server', 'ca-config-set',
                             item.key, item.value | string] }}
      loop: "{{ ipa_crl_drift }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      changed_when: true
      notify: Force CRL regeneration

  always:
    # Runs even if a set fails, so a bad run never leaves the CA down.
    - name: Start the CA
      ansible.builtin.command:
        argv: "{{ ipa_crl_exec + ['systemctl', 'start', ipa_crl_service] }}"
      changed_when: true

- name: Wait for the CA agent interface
  ansible.builtin.command:
    argv: "{{ ipa_crl_exec + ['ss', '-ltn', 'sport = :' ~ ipa_crl_agent_port] }}"
  register: ipa_crl_agent
  until: ipa_crl_agent.stdout is search(ipa_crl_agent_port | string)
  retries: "{{ ipa_crl_service_start_retries }}"
  delay: "{{ ipa_crl_service_start_delay }}"
  changed_when: false
  when: ipa_crl_drift | default([]) | length > 0

- name: Verify the settings survived the restart
  ansible.builtin.command:
    argv: "{{ ipa_crl_exec + ['pki-server', 'ca-config-show', item.key] }}"
  loop: "{{ ipa_crl_drift | default([]) }}"
  loop_control:
    label: "{{ item.key }}"
  register: ipa_crl_verify
  changed_when: false
  failed_when: >-
    ipa_crl_verify.rc != 0 or
    (ipa_crl_verify.stdout | trim | split('=') | last | trim)
      != (item.value | string)
  when: ipa_crl_drift | default([]) | length > 0
