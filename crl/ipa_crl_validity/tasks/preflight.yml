---
- name: Confirm the container is running
  ansible.builtin.command:
    argv: [docker, inspect, -f, "{{ '{{.State.Running}}' }}", "{{ ipa_crl_container }}"]
  register: ipa_crl_running
  changed_when: false
  failed_when: false

- name: Fail fast when the container is absent or stopped
  ansible.builtin.assert:
    that:
      - ipa_crl_running.rc == 0
      - "'true' in ipa_crl_running.stdout"
    fail_msg: >-
      Container '{{ ipa_crl_container }}' is not running on
      {{ inventory_hostname }}.
    quiet: true

# The official freeipa image relocates /etc/pki under /data, so this normally
# reports a real filesystem. If it ever reports overlay, the CA config is on
# the container's scratch layer and anything applied here dies on recreate.
- name: Check whether CA config survives a container recreate
  ansible.builtin.command:
    argv: "{{ ipa_crl_exec + ['sh', '-c', _cmd] }}"
  vars:
    _cmd: >-
      df --output=fstype "$(readlink -f {{ ipa_crl_cs_cfg_dir }})" | tail -1
  register: ipa_crl_fstype
  changed_when: false

- name: Refuse to configure a CA whose settings will not persist
  ansible.builtin.assert:
    that: "'overlay' not in ipa_crl_fstype.stdout"
    fail_msg: >-
      {{ ipa_crl_cs_cfg_dir }} is on the container overlay. Anything applied
      here is lost on the next recreate. Do NOT add a volume and run
      `compose up` â€” that destroys the CA signing key. Migrate the data first.
    quiet: true

- name: Read CRL generation status
  ansible.builtin.command:
    argv: "{{ ipa_crl_exec + ['ipa-crlgen-manage', 'status'] }}"
  register: ipa_crl_gen_status
  changed_when: false
  failed_when: false

- name: Fail fast when this is not the CRL generation master
  ansible.builtin.assert:
    that:
      - ipa_crl_gen_status.rc == 0
      - "'CRL generation: enabled' in ipa_crl_gen_status.stdout"
    fail_msg: >-
      CRL generation is not enabled in '{{ ipa_crl_container }}'. Only the
      generation master builds MasterCRL; these settings are inert anywhere
      else.
    quiet: true

- name: Refuse a model that trades away revocation latency
  ansible.builtin.assert:
    that:
      - ipa_crl_regen_minutes | int > 0
      - ipa_crl_regen_minutes | int <= ipa_crl_max_regen_minutes | int
      - ipa_crl_grace_minutes | int >= 0
    fail_msg: >-
      ipa_crl_regen_minutes is {{ ipa_crl_regen_minutes }} min. Revocations do
      not reach the fleet until the next rebuild. Keep this at or below
      {{ ipa_crl_max_regen_minutes }} and extend ipa_crl_grace_minutes instead.
    quiet: true

- name: Report the intended model
  ansible.builtin.debug:
    msg: >-
      Rebuild every {{ ipa_crl_regen_minutes }} min; nextUpdate ~= thisUpdate +
      {{ ((ipa_crl_expected_window_seconds | int) / 86400) | round(1) }} days.
